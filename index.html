<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小智｜智平衡 AI 客服</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#1a5c38;--g2:#217a4a;--g3:#27ae60;--g4:#2ecc71;
  --gp:#f0faf4;--gl:#a8dfc0;
  --bg:#f5faf7;--white:#fff;
  --t9:#1a1a18;--t7:#3d3d3a;--t6:#5f5e5a;--t4:#9c9a92;--t2:#e0dfdc;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --font:'Noto Sans TC',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t9);display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 60%,var(--g3) 100%);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(26,92,56,.3);flex-shrink:0}
.hdr-logo{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid rgba(255,255,255,.35)}
.hdr-logo svg{width:22px;height:22px;fill:#fff}
.hdr-info{flex:1}
.hdr-name{font-size:15px;font-weight:700;color:#fff}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:4px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:#a8ff8a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.35);white-space:nowrap}
#chatArea{flex:1;overflow-y:auto;padding:20px 0;scroll-behavior:smooth}
#chatWrap{max-width:800px;width:100%;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:4px}
#welcome{text-align:center;padding:24px 16px 20px}
.welcome-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--g2),var(--g4));border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(33,122,74,.3)}
.welcome-icon svg{width:36px;height:36px;fill:#fff}
.welcome-title{font-size:19px;font-weight:700;color:var(--g1);margin-bottom:6px}
.welcome-sub{font-size:13px;line-height:1.9;color:var(--t6);margin-bottom:22px}
.cat-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.cat-btn{padding:8px 18px;border-radius:22px;border:1.5px solid var(--gl);background:var(--white);color:var(--g1);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:.18s}
.cat-btn:hover,.cat-btn.active{background:var(--g3);border-color:var(--g3);color:#fff;box-shadow:0 2px 8px rgba(39,174,96,.35)}
.sugg-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg{padding:8px 14px;border-radius:8px;border:1px solid var(--t2);background:var(--white);color:var(--t7);font-family:var(--font);font-size:12px;cursor:pointer;transition:.15s;text-align:left}
.sugg:hover{border-color:var(--g3);color:var(--g1);background:var(--gp)}
.msg-row{display:flex;gap:9px;align-items:flex-end;margin-bottom:10px;animation:msgIn .22s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.bot-av{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff}
.user-av{background:var(--t2);color:var(--t6)}
.bubble{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.85;word-break:break-word}
.bot-b{background:var(--white);border:1px solid var(--t2);border-bottom-left-radius:4px;box-shadow:var(--shadow);color:var(--t9)}
.user-b{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(33,122,74,.25)}
.ts{font-size:10px;color:var(--t4);font-family:var(--mono);padding:0 3px;flex-shrink:0}
.typing-b{background:var(--white);border:1px solid var(--t2);border-radius:18px;border-bottom-left-radius:4px;padding:14px 18px;box-shadow:var(--shadow);display:flex;gap:5px;align-items:center}
.td{width:7px;height:7px;border-radius:50%;background:var(--gl);animation:bounce .8s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.srcs{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.stag{font-size:11px;background:var(--gp);color:var(--g1);padding:2px 8px;border-radius:4px;font-family:var(--mono);border:1px solid var(--gl)}
.input-bar{background:var(--white);border-top:1px solid var(--t2);padding:12px 16px;flex-shrink:0}
.input-inner{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#inputBox{flex:1;padding:11px 14px;border:1.5px solid var(--t2);border-radius:12px;font-family:var(--font);font-size:14px;color:var(--t9);background:var(--bg);resize:none;outline:none;line-height:1.5;min-height:44px;max-height:120px;transition:border-color .15s}
#inputBox:focus{border-color:var(--g3);background:var(--white)}
#inputBox::placeholder{color:var(--t4)}
#sendBtn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g3));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
#sendBtn:hover{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 2px 8px rgba(33,122,74,.4)}
#sendBtn:disabled{background:var(--t2);cursor:not-allowed;box-shadow:none}
#sendBtn svg{width:18px;height:18px;fill:#fff}
.hint{font-size:11px;color:var(--t4);text-align:center;margin-top:6px;max-width:800px;margin-left:auto;margin-right:auto}
#chatArea::-webkit-scrollbar{width:5px}
#chatArea::-webkit-scrollbar-track{background:transparent}
#chatArea::-webkit-scrollbar-thumb{background:var(--gl);border-radius:3px}
@media(max-width:500px){.hdr-badge{display:none}.bubble{max-width:86%}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
  <div class="hdr-info">
    <div class="hdr-name">小智｜智平衡 AI 客服</div>
    <div class="hdr-sub"><span class="dot"></span>線上服務中</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
    <button onclick="exportCSV()" title="匯出問題紀錄 CSV" style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.25);cursor:pointer;white-space:nowrap;font-family:var(--font);">
      📥 紀錄 <span id="logBadge" style="background:rgba(255,255,255,.3);border-radius:10px;padding:1px 6px;font-size:10px;min-width:16px;text-align:center;display:inline-block;">0</span>
    </button>
    <button onclick="clearChat()" style="background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.25);cursor:pointer;white-space:nowrap;font-family:var(--font);">🗑 清空</button>
    <div class="hdr-badge">智平衡健康集團－創新研發處</div>
  </div>
</header>
<div id="chatArea"><div id="chatWrap">
  <div id="welcome">
    <div class="welcome-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="welcome-title">您好！我是小智 👋</div>
    <div class="welcome-sub">智平衡健康事業 AI 助理<br>請選擇產品類別，或直接輸入您的問題</div>
    <div class="cat-wrap">
      <button class="cat-btn" onclick="setCat('6th',this)">🔴 第六代紅光極智衣</button>
      <button class="cat-btn" onclick="setCat('home',this)">🏠 居家治療儀</button>
      <button class="cat-btn" onclick="setCat('ring',this)">💍 Acer 指環</button>
      <button class="cat-btn" onclick="setCat('asus',this)">⌚ 華碩手錶</button>
      <button class="cat-btn" onclick="setCat('garmin',this)">🟢 Garmin 手環</button>
      <button class="cat-btn" onclick="setCat('fee',this)">💳 費用 / 合約</button>
      <button class="cat-btn" onclick="setCat('clinic',this)">🏥 診所 / 客服</button>
    </div>
    <div class="sugg-wrap" id="suggWrap"></div>
  </div>
</div></div>
<div class="input-bar">
  <div class="input-inner">
    <textarea id="inputBox" placeholder="輸入您的問題…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <div class="hint">由 AI 自動回覆，重要事項請聯繫診所同仁確認</div>
</div>
<script>
const FAQ=[

// ══════════════════════════════════════════
// A. 費用 / 合約（第六代紅光）
// ══════════════════════════════════════════
{id:"A1.1",cat:"A.費用",q:"第六代紅光轉帳帳號是什麼？",a:"戶名：智平衡健康事業股份有限公司\n帳號：0010-3501-7867（國泰世華）"},
{id:"A1.2",cat:"A.費用",q:"已經去匯款繳費了，請提供匯款紀錄",a:"請提供以下資訊：\n1. 匯款日期\n2. 金額\n3. 戶名\n4. 帳號末五碼\n5. 銀行別\n確認已入帳後，記得回覆患者。"},
{id:"A1.3",cat:"A.費用",q:"為什麼不用押金？",a:"合約到期或提前解約時，必須依指示完整歸還。自然損耗或不可抗力不在此限。"},
{id:"A1.4",cat:"A.費用",q:"請問是開發票還是收據？",a:"我們的產品屬於保健用租賃商品，非醫療項目也非醫療器材，提供「二聯式發票」，僅作為個人租賃憑證。\n無法提供醫療收據或公司報帳用的三聯式發票。"},
{id:"A1.5",cat:"A.費用",q:"為什麼只能租不能買？",a:"儀器設定、設備都是客製化製作，期間會針對您的狀況及數據上傳，由醫師評估調整。屬於整體服務，無法買斷。"},
{id:"A2.1",cat:"A.合約",q:"我合約什麼時候到期？保健衣租約起訖日是何時？",a:"依系統合約租期告知患者，先了解患者詢問的原因或需求（挽留）。若患者對租期有疑問，告知請健康顧問回覆。"},
{id:"A2.2",cat:"A.合約",q:"我合約到期了，再來怎麼處理？",a:"詢問患者目前使用狀況及是否有要續約：\n・使用狀況不好或無感：邀約回診，參考醫生建議再決定。\n・使用狀況良好：建議續約，請健康顧問說明費用及期間。"},
{id:"A2.3",cat:"A.合約",q:"合約到期不續約，要怎麼退還保健衣？",a:"到期日後有三天彈性時間，請將紅光設備及極智衣繳回診所，合約才會停止計算。\n可郵寄（請在包裹上寫姓名），宅配限一次免費。\n\n郵寄地址：\n・台北：台北市中正區館前路49號11樓，(02)2370-1959\n・台中：台中市中區民權路60號3樓，(04)2222-1817\n・高雄：高雄市三民區九如二路366號10樓，(07)323-0919"},
{id:"A2.4",cat:"A.合約",q:"合約結束了想退押金？",a:"需先退還設備用品，再提供押金退款帳號（存摺封面照片）。\n押金約15個工作天會匯款至指定帳戶，匯款完成後通知您做查帳。"},
{id:"A2.5",cat:"A.合約",q:"衣服/儀器已經寄回去，收到了沒有？",a:"請告知寄回日期及收件地址，我們查詢後回覆。\n目前流程：郵寄（台北/台中/高雄）或親自交回台北11樓櫃檯或各地診所，健管收到後轉給健康顧問。"},
{id:"A2.6",cat:"A.合約",q:"費用是否含營養保健品？我需要持續吃保健品嗎？",a:"費用不包含營養品，如果有需要需自費購買。\n可以詢問醫師是否有需要繼續吃保健品。"},
{id:"A2.7",cat:"A.合約",q:"提早解約，費用要怎麼算？",a:"依「實際使用期間比例」計算可退金額，會先扣除客製極智衣耗材費：新台幣50,000元。"},
{id:"A3.1",cat:"A.合約",q:"想轉其他方案",a:"詢問想轉換療程的原因，並留言給健康顧問，請健康顧問幫您討論規劃，再通知您後續。"},

// ══════════════════════════════════════════
// B. 第六代紅光極智衣 - 使用
// ══════════════════════════════════════════
{id:"B1.1",cat:"B.第六代",q:"第六代紅光極智衣是什麼做的？",a:"極智衣服內外層皆為彈性材質的機能布料、快乾、透氣，穿脫方便、活動不受限。\n主要是內層的紅光貼片用來調節神經。"},
{id:"B1.2",cat:"B.第六代",q:"紅光貼片的功能是什麼？",a:"1. 誘發細胞能量工廠之稱的粒線體活化，促進新陳代謝和細胞修復\n2. 神經傳導路徑激活，促進交感與副交感神經平衡"},
{id:"B1.3",cat:"B.第六代",q:"貼片有效期的問題嗎？",a:"貼片測試後是可以反覆使用的。如果有儀器上的使用問題，請再跟我們說。"},
{id:"B1.4",cat:"B.第六代",q:"極智衣怎麼穿才對？",a:"1. 裡面不能穿（當內衣穿）\n2. 衣服順順紮進內褲裡\n3. 側邊肩線對齊\n4. 拉鍊在中線，通過肚臍\n5. 將背帶斜揹，調整長度到腰際高度\n6. 穿著時，可做家事、工作、緩和運動都行\n7. 轉身移動範圍不要太大\n\n每次治療60分鐘，一天最多兩次，需間隔六小時以上。"},
{id:"B1.6",cat:"B.第六代",q:"什麼時候穿比較好？",a:"・胃食道逆流：餐前穿，讓腸胃做暖身動作，幫助蠕動與消化，效果更好。\n・睡眠障礙及其他症狀：晚上睡前穿。\n・其他問題：每日建議選擇固定的時間穿即可（神經痛可選擇在容易疼痛時間穿）。"},
{id:"B1.7",cat:"B.第六代",q:"醫生說餐前1小時穿，可是時間來不及，可以餐中穿嗎？",a:"每日找午/晚其中一餐穿，主要是在餐前先促進腸胃血液循環。\n如果來不及，用餐同時可以繼續穿，沒有問題。\n穿的時候放輕鬆，不要一直想穿多久，越想會越焦慮反而不好。"},
{id:"B1.8",cat:"B.第六代",q:"極智衣怎麼洗？洗滌保養說明",a:"1. 先拔開控制器（控制器不可水洗）\n2. 建議3天至2週洗一次\n3. 將衣服集線盒置在衣服中間並包覆起來，再裝入專屬洗衣袋\n4. 置於洗衣機中清洗\n5. 勿搓揉、擰乾；勿加柔軟精；勿烘乾"},
{id:"B1.9",cat:"B.第六代",q:"洗後，會不會影響效果？",a:"不會，第六代紅光極智衣的部件已經過水洗測試，是可以水洗的。控制器部分不能水洗。"},
{id:"B2.1",cat:"B.第六代",q:"紅光控制器怎麼操作？",a:"1. 衣服穿著完畢\n2. 白色插頭連接在控制器上\n3. 長按電源鍵直至儀器響起\n4. 開機後，連結藍芽\n5. 更新部位確認\n6. 按下功能鍵，開始治療"},
{id:"B2.2",cat:"B.第六代",q:"燈號說明？治療中提示音及燈號顯示",a:"【燈號說明】\n・綠燈恆亮：開機 或 充電已完成\n・綠燈閃爍：充電中\n・白燈恆亮：使用中\n・白燈閃爍：暫停中\n・黃燈恆亮：電量偏低，本次使用完請充電\n・紅燈恆亮：1.合約到期  2.還在六小時的冷卻期間\n・紅燈閃爍：電量太低，請充電後再使用\n・藍燈閃爍：藍芽資料傳輸中"},
{id:"B2.3",cat:"B.第六代",q:"使用中有沒有活動上的限制？",a:"建議動作不要太大，以免線路移位導致接觸不良。若不小心扯掉接頭，會觸發接頭鬆脫警示。"},
{id:"B2.4",cat:"B.第六代",q:"都在同一時間點治療，會有適應性的問題嗎？",a:"一般建議睡前穿紅光衣，因為比較能幫助放鬆身心、穩定入睡。\n如果發現睡前穿反而更清醒，可能跟天氣變化、壓力波動有關，不一定是治療本身造成的。\n建議在「沒壓力、能安心休息」的時間治療，效果通常會更好，可以依照生活節奏自由調整穿戴時間。"},
{id:"B2.5",cat:"B.第六代",q:"一天可以做幾次治療？",a:"一天最多兩次，建議由醫師評估，每次間隔不得少於六小時。"},
{id:"B2.6",cat:"B.第六代",q:"晚上治療後，隔天中午以前無法使用？",a:"目前每次治療間隔不得少於6小時，若兩次間隔不足6小時，將無法再次使用。"},
{id:"B2.7",cat:"B.第六代",q:"怎麼知道紅光控制器有正常運作或是已經停止？",a:"1. 紅光控制器於運作中，logo燈會發光；本次調整結束控制器將會自動關機，燈號熄滅。\n2. 可連接藍芽確認儀器狀態。"},
{id:"B2.8",cat:"B.第六代",q:"貼片只有亮幾個/貼片沒有正常輸出紅光？",a:"紅光貼片共有48片，會依照醫師調整點位點亮，不會48片全亮，貼片根據醫師評估開立，最多會有16片。\n建議可連接藍芽確認儀器狀態。\n將由快遞到府收件，送回公司檢修。"},
{id:"B2.9",cat:"B.第六代",q:"紅光治療中可以中斷嗎？",a:"每次調解為60分鐘，建議一次完成。若有不可抗因素，可以按下功能鍵暫停。暫停沒有時間限制，但仍建議一小時內完成，較能累加能量。\n\n・暫停前不足30分鐘：可開機重新治療60分鐘\n・暫停前超過30分鐘：須等6小時冷卻後才能治療\n\n暫停每五分鐘會提醒一次，二十分鐘後關機。"},
{id:"B2.10",cat:"B.第六代",q:"藍牙連換位置時，因位子因素無法更換怎麼辦？",a:"先判斷是否為系統串接的問題，或是電話號碼錯誤。\n如果非以上問題，請將儀器送回，檢視是否為藍芽或儀器內部問題。"},
{id:"B3.1",cat:"B.第六代",q:"充電注意事項？",a:"先拔開衣服端，使用專屬充電器，充電時不可同時治療。\n\n充電步驟SOP：\n1. 插電後，語音提示充電中，LOGO燈號傳為綠燈閃爍\n2. 4~6小時充飽電\n3. 充電完成後，會有語音提示，且LOGO燈綠燈轉為恆亮\n4. 再拔插頭"},
{id:"B3.2",cat:"B.第六代",q:"充電燈號說明",a:"・充電中：綠燈閃爍\n・充電完成（滿電）：亮綠燈"},
{id:"B3.3",cat:"B.第六代",q:"充電失敗怎麼辦？四小時未飽電/充電時燈號熄滅",a:"1. 確認使用智平衡提供的充電組\n2. 充電線需完整插入Type C孔\n3. 重新插上插座確認目前指示燈號\n\n注意：電量極低或完全沒電時充到滿，會需要6~8小時（因極低電量的充電保護機制，導致前段充電時間延長）。"},
{id:"B3.4",cat:"B.第六代",q:"帶到國外電壓不同，會不會無法充電？出國坐飛機怎麼帶？",a:"儀器內建變壓器，100~240V均可使用，需自備轉接頭（須符合當地規格）。\n\n出國搭飛機：\n・控制器：需放隨身行李\n・極智衣：可放托運行李中\n\n注意：鋰電池已通過安全規範，認證貼於儀器表面。因中國大陸認證機制特殊，無法帶入中國大陸。"},
{id:"B4.1",cat:"B.第六代",q:"哪種方案效果好？",a:"・短期見效：居家\n・長期調理：第六代\n・重點保養：第四、五代紅光\n・溫和恢復：調節衣、睡眠衣"},
{id:"B4.2",cat:"B.第六代",q:"穿了以後用藥怎麼調整？",a:"請隨時在APP上面留紀錄，並拍處方籤，我們會盡快聯繫您，並請醫師幫您評估調整。"},
{id:"B4.4",cat:"B.第六代",q:"紅光雙效活力衣有禁忌症嗎？",a:"沒有，若有疑問可以再請教健康顧問或醫師。"},
{id:"B4.5",cat:"B.第六代",q:"皮膚有傷口，能直接照射嗎？發炎情況下，有沒有可能惡化？",a:"先了解發炎部位是否與治療重疊。\n建議留下紀錄在APP對話中，或立即與健康顧問聯繫，協助評估與調整。"},
{id:"B4.6",cat:"B.第六代",q:"紅光的波長是多少？屬於紅外線嗎？",a:"660nm區間，屬於有特殊物理特性的可視紅光（非紅外線）。"},
{id:"B4.7",cat:"B.第六代",q:"儀器有沒有衛服部認證？",a:"紅光儀器屬於「保健用產品」，主要是做為日常身心放鬆、自律神經調節的非侵入式輔助方案。\n由於療程搭配有醫師診斷與專人追蹤，我們會根據您的身體反應進行貼片調整，確保安全與適配性。"},
{id:"B4.8",cat:"B.第六代",q:"有專利號嗎？",a:"TW202029899A、TW202029992A、TWM659528U"},

// ══════════════════════════════════════════
// C. 儀器衣服（第六代）
// ══════════════════════════════════════════
{id:"C1.1",cat:"C.儀器衣服",q:"什麼時候可以拿到第六代紅光極智衣？",a:"我們會安排專人與您聯繫，安排您方便的時間，進行到府教學，亦可到診所這邊進行教學。\n現場練習穿戴及操作儀器，訓練當天特別申請一次治療讓您回家使用。"},
{id:"C1.2",cat:"C.儀器衣服",q:"回診當天，需要帶什麼回來？",a:"當天需要您帶健保卡回診及部分負擔50元。"},
{id:"C1.3",cat:"C.儀器衣服",q:"看診能把改好的衣服帶回家嗎？",a:"當收到APP通知，即可知道醫師判斷您這次的狀況是否需要調整點位，您即可利用APP進行遠端部位調整。"},
{id:"C1.4",cat:"C.儀器衣服",q:"衣服可以寄過來給我嗎？我要改寄件地址？",a:"如您不方便取貨，我們可採郵寄方式寄送，跟您確認基本資料表上的寄件地址/電話。"},
{id:"C1.5",cat:"C.儀器衣服",q:"衣服是新的還是舊的？收到後要先清洗或用酒精消毒嗎？",a:"第六代紅光極智衣皆是針對個人客製化完成，屬全新，您可放心使用。是否先清洗再穿您可自行斟酌。"},
{id:"C1.6",cat:"C.儀器衣服",q:"我覺得極智衣Size不對？",a:"先了解哪個部分較緊/寬，請確認保健衣衣領內部的size。\n1. 衣服在製作過程到送出均有名牌貼在衣服上，出貨前也會再確認，請放心。\n2. 您穿看看真的不行，下次看診時將極致衣帶回，會由專人幫您修改。"},
{id:"C2.1",cat:"C.儀器衣服",q:"多久回來看診？",a:"健康顧問每兩周會與您聯繫，且醫師每兩周會回顧您這兩周的狀況，判斷是否有需要調整點位；若沒有特殊狀況，3個月回來看診一次即可。"},

// ══════════════════════════════════════════
// D. 突發事件（第六代）
// ══════════════════════════════════════════
{id:"D1.1",cat:"D.突發事件",q:"穿了以後會頭暈、心跳加快？其他症狀？",a:"請您從APP上回報給我們，我們會幫您做初步紀錄及建議。\n頭暈跟心跳加快是原本循環問題，治療過程有改善循環，循環變好症狀就會慢慢改善。\n如果您持續感覺不適，也請讓我們知道，我們會請醫師評估。"},
{id:"D1.2",cat:"D.突發事件",q:"穿了之後皮膚很癢，沒辦法穿怎麼辦？",a:"有些患者皮膚較敏感，建議第六代紅光極智衣洗過再穿。\n治療過程有改善循環，循環變好症狀就會慢慢改善。"},
{id:"D1.3",cat:"D.突發事件",q:"什麼時候要上傳數據？",a:"一般建議兩周要更新一次使用紀錄，以便醫師根據您的使用狀況，進行點位調整。\n健康數據只要穿戴並固定期間充電，應會自動連藍芽。\n病情紀錄建議三天內觀察症狀，固定回報，讓醫師可以掌握。"},
{id:"D1.4",cat:"D.突發事件",q:"我怎麼知道醫師幫我改點了？",a:"APP會推播訊息給您，告訴您本次醫師評估是否需要調整位置，與點位是否調整完畢。"},
{id:"D2.1",cat:"D.突發事件",q:"儀器暫停，語音提示接頭接觸不良？",a:"代表白色插頭與連結處結合鬆脫，請把此處插緊，控制器將自動開始運作。\n如插緊後仍出現此訊號，請將衣服回送生產部（可能是集線盒排線或單一組貼片接觸不良）。"},
{id:"D2.2",cat:"D.突發事件",q:"黃燈閃爍是什麼情況？",a:"電量偏低，請於本次使用後立刻進行充電。"},
{id:"D2.3",cat:"D.突發事件",q:"紅燈閃爍是什麼情況？",a:"電量過低，有可能在使用途中斷電，請先充電後再使用。"},
{id:"D2.4",cat:"D.突發事件",q:"儀器有無法遙控解決的問題？",a:"請您帶回診所做檢修。因儀器等相關不可抗因素導致治療中斷，我們會申請天數延後。"},
{id:"D2.5",cat:"D.突發事件",q:"未連藍芽，治療時間未滿60分鐘就結束？",a:"請患者連藍芽，讓我們由後台查看數據。"},
{id:"D2.6",cat:"D.突發事件",q:"出現合約到期提示音，儀器無法正常使用？",a:"先利用基本資料中的【重設藍芽裝置設定】解決。\n操作：1.會員中心 → 2.基本資料 → 3.下滑到【重置藍芽】\n（可能是儀器的RTC跑掉）"},
{id:"D2.7",cat:"D.突發事件",q:"出現【今日已使用】異常訊號？",a:"1. 確認距上次使用結束，已隔六小時以上\n2. 後台查詢→讀取訂單→開始日期:114/01/01（app工程師設定的問題）"},
{id:"D2.8",cat:"D.突發事件",q:"治療儀器開機後直接關機？",a:"確認患者是否長按超過3分鐘以上，導致開機後又關機。"},
{id:"D2.9",cat:"D.突發事件",q:"治療儀器開機並按開始治療後，自動關機？",a:"先去APP後台看操作紀錄，如出現同一接頭接觸不良（有可能是衣服接頭問題，需重製衣）。"},
{id:"D2.10",cat:"D.突發事件",q:"充電不能，一直出現紅色LOGO燈？",a:"確認無法充電後，請開立交換儀器訂單執行交換。"},
{id:"D2.11",cat:"D.突發事件",q:"使用中出現答答答雜音、自動開關機或儀器變熱？",a:"請開立交換儀器訂單執行交換。"},
{id:"D2.12",cat:"D.突發事件",q:"使用紀錄未完善？",a:"與儀器版本有關，需為韌體0401版本。治療後一分鐘儀器會自動關機。\n若未成功上傳資料，明天開機連藍芽，會將前一天的治療結束紀錄補上傳。"},
{id:"D2.13",cat:"D.突發事件",q:"使用儀器治療時衣服沒有亮紅光？",a:"1. 先確認控制器有無壓實\n2. 是否有按治療開始\n3. 從APP後台看有沒有特定哪一組接觸不良"},
{id:"D2.14",cat:"D.突發事件",q:"儀器背帶鬆脫？",a:"背帶扣環可能有鬆掉，需要一字起子固定，建議回診由現場協助（目前出廠前已有用膠水加強固定）。"},

// ══════════════════════════════════════════
// E. 平衡衣
// ══════════════════════════════════════════
{id:"E1.1",cat:"E.平衡衣",q:"平衡衣是什麼材質，作用是什麼？",a:"平衡衣是舒適的T恤版型，貼片是石墨烯材質，作用是紅外線，能做機能性調整。面對不同情境可自選適合的平衡衣。"},
{id:"E1.2",cat:"E.平衡衣",q:"平衡衣多久會有一件？最多幾件？",a:"平均一年會有10-12件。"},
{id:"E1.3",cat:"E.平衡衣",q:"用我的最愛製作，如果每個位置都喜歡，可以都製作嗎？",a:"會由醫師評估，AI協助選點。"},
{id:"E1.4",cat:"E.平衡衣",q:"平衡衣什麼時候穿，誰幫我判斷？",a:"您可以跟APP討論，AI會經由您的數據、狀況去給適合的建議。"},
{id:"E1.5",cat:"E.平衡衣",q:"平衡衣貼片的效期有永久的嗎？",a:"黑點的能量是會持續的，但會依照使用習慣和清潔習慣不同，黑點會逐漸有磨耗的狀態，大概可以使用3~6個月，或更久。"},
{id:"E1.6",cat:"E.平衡衣",q:"平衡衣貼片會渲染，怎麼會這樣？",a:"請您拍照讓我們看一下衣服裡面的貼片狀況，我們幫您申請一件新的。"},

// ══════════════════════════════════════════
// F. 手錶指環（Acer FreeSense Ring）
// ══════════════════════════════════════════
{id:"F1.1",cat:"F.手錶指環",q:"超過保固期，遇到無法正常使用的情況？",a:"合約期間，非人為蓄意破壞，請寄回公司，我們將承擔修復的費用。"},
{id:"F1.2",cat:"F.手錶指環",q:"數據無法正常更新？",a:"請先確認基本狀態：\n1. 裝置電量充足（建議30%以上）\n2. 手機藍牙已開啟\n3. 裝置有正確配戴在建議位置（不過鬆或過緊）\n\n重新連線（多數問題可解決）：\n・關閉手機藍牙 → 等待約10秒 → 再重新開啟\n・將穿戴裝置靠近手機（建議30公分內）\n・重新打開對應的App：成人：ASUS HealthConnect / FreeSense App；小孩：Garmin Connect\n\n簡單重啟：重啟穿戴裝置、重啟手機"},
{id:"F1.3",cat:"F.手錶指環",q:"錶面較大，手腕活動時，影響動作？",a:"可至少隔一指的寬度往上戴，依照每個人的手臂舒適度，可以稍微鬆一點。"},
{id:"F1.4",cat:"F.手錶指環",q:"戒指指環比較大，容易鬆脫？",a:"建議順序：\n1. 可以先試著戴中指或是慣用手食指\n2. 請研發部設置止滑墊片\n3. 更換小尺寸指環"},
{id:"F1.5",cat:"F.手錶指環",q:"指環無法連線？",a:"1. 確認指環是否有電\n2. 重新連接裝置"},
{id:"F1.6",cat:"F.手錶指環",q:"手錶突然黑屏？",a:"1. 確認充電是否為充電頭插接（不要插電腦）\n2. 充電20-30分鐘\n3. 長按開關10秒或是點兩下螢幕\n4. 如果還是無法正常使用，送回公司檢修"},
{id:"F1.7",cat:"F.手錶指環",q:"ACER指環心律變異性正常數值是多少？",a:"心率變異數字沒有特定標準，根據年齡與狀態而有不同。通常是相對比較越高越好。"},
{id:"F1.8",cat:"F.手錶指環",q:"充電完後就顯示BOOTLOADER畫面？",a:"屬於工程畫面。排解方式：\n請再次連接USB充電線，長按右上方按鈕約12秒，等待螢幕出現BOOTLOADER藍色字樣後放開，再短按一次右上方按鈕即可開機。\n若誤觸進入bootloader模式，請按一下手錶右上方的按鈕即可離開。"},
{id:"F1.9",cat:"F.手錶指環",q:"指環及手錶的數據上傳不完整？",a:"1. 先了解配戴狀況，合身與否\n2. 有沒有電力歸零\n3. 連線狀態是否正常\n\n備註：數據撈取訂為六小時後。數據皆會存在裝置中，等藍芽連線後會自動上傳資料。"},
{id:"F1.10",cat:"F.手錶指環",q:"指環或手錶的睡眠時間不符合現實？",a:"先了解同一時間的其他健康數據是否正常輸出，如果無，請回到F1.9排解。\n如果未睡著前心律較低且穩定，沒有太大移動動作，會被判定為睡眠開始。"},
{id:"F1.11",cat:"F.手錶指環",q:"指環或手錶的睡眠數據中斷？",a:"先了解同一時間的其他健康數據是否正常輸出，如果無，請回到F1.9排解。\n1. 如果在睡眠期間心律高於100，會被判定為不是睡覺狀態，血氧也有可能影響。\n2. 裝置在無意識狀態（睡眠）時，是否脫掉而不自知。"},
{id:"F1.12",cat:"F.手錶指環",q:"手錶功能問題：有鬧鐘聲音提醒嗎？有一卡通、天氣、跌倒偵測嗎？",a:"1. 沒有鬧鐘聲音提醒\n2. 沒有一卡通、天氣、跌倒偵測（因為我們用的是企業APP，沒有綁定GPS和個人資料）"},
{id:"F1.13",cat:"F.手錶指環",q:"手錶無法測量到心電圖？",a:"排解步驟：\n1. 手錶是否配戴正常，錶帶鬆緊度適中，錶盤能緊貼手腕處\n2. 確認感測器有無髒污\n3. 會員是否皮膚乾燥，可以用保濕乳液潤濕後再測試\n4. 確認App與手錶韌體版本是最新\n\n排解後仍有問題，回報給創新研發處評估是否送檢或交換儀器。"},
{id:"F1.14",cat:"F.手錶指環",q:"指環出現綁定其他裝置的訊號？",a:"由各地安卓手機/平板下載戒指解綁定的程式，現場協助解綁。"},
{id:"F1.15",cat:"F.手錶指環",q:"指環AI建議出現非正確數據（如年紀、體重、身高）？",a:"已提報給廠商做處理，未來會從軟體更新調教AI讀取。"},
{id:"F1.16",cat:"F.手錶指環",q:"華碩手錶上超慢跑時，出現震動要如何關閉？",a:"1. 提醒會員保持在設定的步頻以上，就不會有震動。\n2. 可以降低步頻設定，配合自己的節奏和呼吸。"},
{id:"F1.19",cat:"F.手錶指環",q:"App一直轉圈、連線瞬斷、無法穩定連上指環、同步卡住？",a:"更新至App 1.0.7、重新開啟App、確認藍牙與距離、重新連線。\n若仍發生，請使用者提供：\n1. 問題截圖\n2. App log\n3. 發生時間\n4. 手機型號與系統版本\n5. App版本與FW版本，供後續排查。"},
{id:"F1.20",cat:"F.手錶指環",q:"使用者重新登入帳號或重新綁定指環後，歷史資料不見？",a:"確認App 1.0.7、確認是否同帳號登入、重新同步資料。\n若資料仍未恢復，請記錄：\n1. 登入帳號\n2. 重新登入/綁定時間\n3. 消失的資料日期範圍\n4. App版本，提供工程端查詢。"},
{id:"F1.21",cat:"F.手錶指環",q:"正常配戴指環，但某段心率、活動、壓力、HRV或其他資料缺失？",a:"1. 請確認指環韌體已更新至FW 1.2.0或以上版本\n2. 確認指環當時是否有低電量\n3. 確認該時段是否有正常配戴\n4. 開啟App並等待同步完成\n5. 若同步未完成，可重新開啟App後再次連線\n\n若仍有資料缺漏，請提供：\n・缺漏資料類型\n・缺漏日期與時間區間\n・指環電量狀態\n・App與FW版本\n・是否曾斷線、重登或重新綁定"},
{id:"F1.22",cat:"F.手錶指環",q:"只有睡眠資料沒有產生或遺失，但其他資料正常保存？",a:"1. 確認睡眠期間是否全程配戴指環\n2. 確認睡前指環電量是否充足\n3. 起床後開啟App並等待資料同步完成\n4. 確認其他生理資料是否仍正常保存\n\n此問題目前列為FW優化項目，預計於FW 1.2.1改善。若遇到案例，請持續收集：睡眠日期、配戴時間、電量、App版本與FW版本。"},
{id:"F1.23",cat:"F.手錶指環",q:"指環突然無法連線，需要放回充電座後才可恢復連線？",a:"1. 將指環放回充電座\n2. 確認充電座是否有正常供電\n3. 等待指環恢復後，再重新連線App\n4. 若多次發生，判定為異常，建議直接安排換貨處理，異常品可退回進一步分析。"},

// ══════════════════════════════════════════
// G. APP / 藍芽
// ══════════════════════════════════════════
{id:"G1.1",cat:"G.APP藍芽",q:"Android無法透過App連結藍芽？",a:"1. 先確認手機目前是否有網路\n2. 連結WiFi後再試\n3. 重啟App（滑掉後重新開啟）\n4. 重開控制器"},
{id:"G1.2a",cat:"G.APP藍芽",q:"APP如需驗證碼，但個人無法成功時？",a:"可提供公用驗證碼：23709"},
{id:"G1.2b",cat:"G.APP藍芽",q:"連結藍芽後，治療時間顯示是90分鐘？",a:"我們通知工程單位，遠端幫您做處理。判斷：可能是APP問題，導致讀取錯誤。"},
{id:"G1.3",cat:"G.APP藍芽",q:"未連藍芽的情況下使用儀器治療，時間未滿60分鐘就結束？",a:"請患者連藍芽，讓我們由後台查看使用紀錄及數據。"},
{id:"G1.4",cat:"G.APP藍芽",q:"APP無法顯示個人資料或無法治療？",a:"系統查看，該患者的電話號碼有兩個人以上都掛這支電話，請另外一位改另外支號碼。"},
{id:"G1.5",cat:"G.APP藍芽",q:"充電中，可以治療或連藍芽嗎？",a:"不能治療，但可以連藍芽看資料。"},
{id:"G1.6",cat:"G.APP藍芽",q:"穿衣紀錄天數計算？",a:"按開始就會算天數。這個功能是使用各式產品的總合天數，不與單一產品使用紀錄勾稽。"},
{id:"G1.7",cat:"G.APP藍芽",q:"藍芽更新後，如出現無法按【開始】？",a:"將手機中的APP頁面，滑掉後重新開啟APP，重新開機。"},
{id:"G1.8",cat:"G.APP藍芽",q:"藍芽離開多遠會斷線？",a:"建議3-4公尺以內，並且不要有遮蔽物。"},
{id:"G1.9",cat:"G.APP藍芽",q:"治療中，手機滑掉頁面，需要重新連藍芽嗎？",a:"如果滑掉的畫面停留在治療倒數就不需要重新手動連藍芽，會自動再連上（10-30秒）。"},
{id:"G1.10",cat:"G.APP藍芽",q:"APP治療更新無法完成？",a:"1. 換其他網路連看看\n2. 重啟APP（滑掉重新開始）\n3. 重開控制器\n重要：更新後，如果還是一樣，請務必重開機。"},
{id:"G1.11",cat:"G.APP藍芽",q:"最近怎麼看不到治療倒數時間，和穿衣紀錄？",a:"為了不干擾治療感受，暫時先將一些功能隱藏，持續優化後，屆時會再開放給會員使用。"},
{id:"G1.12",cat:"G.APP藍芽",q:"APP無法下載？",a:"確認APP STORE註冊國籍是否在開放的國家。如果沒有，請跟工程團隊告知。"},
{id:"G1.13",cat:"G.APP藍芽",q:"會員想改回前一次的位點，但沒有加到我的最愛，有辦法調整嗎？",a:"作法一（須由治療師操作）：\n1. 儲存目前的部位\n2. 將上次部位複製到最新一筆看診日期的欄位\n3. 請會員更新，加入我的最愛\n4. 再將目前部位回貼到最新一筆看診日期欄位，並請會員再更新一次\n\n作法二：開照會給醫師，請醫師評估改點"},
{id:"G1.14",cat:"G.APP藍芽",q:"藍芽連結失敗？",a:"判斷是因為儀器當下正在忙線，在排隊中就會拒絕連線（會嘗試三次，都失敗才顯示）。搜得到這台但連線失敗是暫時的，重開再試。後續完整滑掉重新開機後都有連接成功。"},
{id:"G1.15",cat:"G.APP藍芽",q:"健康日誌的每週摘要時有時無，陪伴旅程使用紀錄未顯示完整？",a:"當週摘要是AI撈累積對話來生成的，只要按一次摘要就會重新生成，所以不會每次都完全相同。\n兩週以上的摘要才會固定內容。\n當週固定內容：\n1. 最後一次按本週摘要生成的內容\n2. 後台如果讀取不到，會在週一統一整理當週留言主動生成。"},

// ══════════════════════════════════════════
// H. 居家治療儀
// ══════════════════════════════════════════
{id:"H-A1",cat:"H.居家治療儀",q:"居家治療怎麼收費？",a:"・2個月(60天)：$90,000\n・3個月(90天)：$126,000\n・儀器押金：$41,000（本島）；金門收$50,000"},
{id:"H-A2",cat:"H.居家治療儀",q:"居家治療儀匯款帳號是什麼？",a:"地區｜銀行｜帳號\n・台北/桃園：國泰世華 013 / 001035017751\n・新竹/台中：國泰世華 013 / 001035013683\n・高雄：國泰世華 013 / 001035017867\n\n匯款後請提供：\n1. 患者姓名、出生年月日\n2. 匯款戶名/匯款人姓名\n3. 匯款金額及日期\n4. 匯款帳戶末五碼"},
{id:"H-A4",cat:"H.居家治療儀",q:"什麼時間要付款？",a:"1. 簽約當下即收取居家租金，若患者不願意一次繳，則收取訂金$20,000\n2. 返家訓練日當天收完尾款與儀器押金$41,000\n\n備註：押金僅能轉帳/付現"},
{id:"H-A7",cat:"H.居家治療儀",q:"居家治療可以請假嗎？",a:"一個月可以有5天不用理由請假（出差/出遊）。\n若要住院開刀不確定請假天數，則會視公司是否需要儀器先調度回來，再回覆患者。\n\n備註：請假需備註於LINE記事本。"},
{id:"H-A13",cat:"H.居家治療儀",q:"居家儀器有衛服部認證嗎？",a:"有，醫療器材許可證編號：\n・NC108：衛部醫器製字號 007501號\n・三合一：衛署醫器製字號 000627號"},
{id:"H-B12",cat:"H.居家治療儀",q:"治療衣能自己洗嗎？",a:"治療衣內層有貼片/導電布，不可自行清洗。請寄回由公司專人清潔與更換貼片。"},
{id:"H-B13",cat:"H.居家治療儀",q:"治療衣能穿多久？",a:"・第一代貼片：7天\n・第二代貼片：10-14天\n收到新的治療衣後就可改用新的進行治療。"},
{id:"H-B21",cat:"H.居家治療儀",q:"治療衣裡面能穿內衣嗎？",a:"不可以。貼片或導電布需直接接觸皮膚才能導電並產生效果，請直接脫下內衣再穿治療衣。"},
{id:"H-B22",cat:"H.居家治療儀",q:"治療衣穿法步驟（居家）",a:"第一代（電療貼片）：\n1. 撕下貼片上的白色貼紙（共12張），治療後要貼回保存黏性\n2. 衣服套上後，雙手抓住內外衣從背後往上撈起、再往下順拉\n3. 把衣服下擺塞進內褲內（前後都要），幫助貼片貼合\n4. 確保肩膀側線在正側邊，拉鍊通過肚臍\n5. 貼片位置依示意圖撫平，避免皺摺與翹起\n\n第二代（導電布）：\n導電布需要水凝膠去做傳導，塗的量大約一個小指頭指節。\n雙手抓後面內裡跟外衣，稍微往上捲起，再大面積往下拉，像順裙子的感覺，接著紮進內褲裡。"},
{id:"H-B31",cat:"H.居家治療儀",q:"什麼時候穿治療衣比較好？",a:"建議洗澡擦乾後，再穿上，可以保持貼片黏性，傳導也較好。"},
{id:"H-C11",cat:"H.居家治療儀",q:"三合一（定時版）儀器怎麼操作？",a:"1. 確認電源線有插上並長時間插電保持充電\n2. 打開左側三個黑色總開關（聽到嗶聲）\n3. 所有旋鈕逆時針轉到底（歸零），才能啟動儀器\n4. 治療時順時針轉動旋鈕調整強度，請以「舒服有感」為原則\n5. 50分鐘後儀器會自動響起，表示治療結束\n6. 旋鈕歸零，關掉總開關（電源線不拔除）"},
{id:"H-C21",cat:"H.居家治療儀",q:"三合一（密碼版）儀器怎麼操作？",a:"1. 插上電源線（儀器紅燈亮）\n2. 輸入8碼密碼，按下「#」，綠燈亮表示成功\n3. 左側三個總開關全開啟（聽到嗶聲）\n4. 將所有旋鈕逆時針歸零\n5. 順時針調整旋鈕至適合強度開始治療\n6. 治療50分鐘後自動響起，旋鈕歸零並關閉總開關（不拔電源線）"},
{id:"H-C22",cat:"H.居家治療儀",q:"密碼版：密碼按了，燈號不亮？",a:"・電源線是否有常態插在儀器上（應有紅燈）\n・密碼是否按錯\n・是否有按「#」\n・當天是否已治療過\n\n特殊情況：密碼版常有369號碼（下排）接觸不良，請確認按369鍵是否有嗶音，若無反應可能接觸不良，請通知客服更換儀器。\n\n正常：輸入密碼#→嗶一聲→綠燈\n密碼錯誤：嗶二聲，綠燈不亮\n密碼正確但過期：嗶一聲，綠燈不亮"},
{id:"H-C23",cat:"H.居家治療儀",q:"居家治療儀何時可以治療？",a:"每天固定一個您舒適的時間。\n注意：凌晨02:00-04:00是機器重置校正時間，最晚請在23:00以前開始做，機器到凌晨24:00就會自動關機。"},
{id:"H-C31",cat:"H.居家治療儀",q:"NC108儀器怎麼操作？",a:"1. 按左上角電源鍵，綠燈亮起\n2. 確認畫面上的姓名、剩餘天數\n3. 勾選「穿戴完成」與「導線接妥」後按下【下一步】\n4. 依照身體感受調整6個頻道強度（可用旋鈕或螢幕+/-微調）\n5. 確認無誤後按【開始】\n6. 50分鐘治療結束後按電源鍵關機\n\n注意：盡量在當天23:50前開始治療，否則會算至隔天次數。"},
{id:"H-C32",cat:"H.居家治療儀",q:"NC108治療中想上廁所或發生疼痛不適怎麼辦？",a:"想上廁所：\n按【暫停】鍵，回來後按【返回】，儀器會自動調回原本強度。\n每次治療僅限按兩次暫停，勿按電源鍵！暫停保留時間預計2-3分鐘。\n\n治療中發生疼痛不適：\n請按緊急按鈕，再確認貼片是否服貼於皮膚上。\n如果已開始超過三分鐘，關掉電源鍵當天就無法使用。"},
{id:"H-D14",cat:"H.居家治療儀",q:"居家治療一天可以治療兩次嗎？",a:"醫師建議一天一次就好，居家儀器每日使用一次即已達密集刺激標準。每天兩次怕身體負擔較大，容易疲倦，效果可能打折。"},
{id:"H-E11",cat:"H.居家治療儀",q:"居家治療時會刺痛怎麼辦？",a:"1. 確認貼片都是平順於皮膚上\n2. 確認是否強度太強\n3. 檢查衣服裡面的貼片和線是否分離"},
{id:"H-F12",cat:"H.居家治療儀",q:"水凝膠不夠了怎麼辦？",a:"可以郵寄補充或診所自取。沒有水凝膠無法治療，協助請假直至取得水凝膠。\n自取請先確認診所營業時間，避免白跑一趟。"},
{id:"H-F13",cat:"H.居家治療儀",q:"水凝膠要額外收費嗎？",a:"正常使用下，若提前用完，目前是免費提供。需提出申請（口頭/電話/LINE）。"},

// ══════════════════════════════════════════
// Acer 指環（產品規格）
// ══════════════════════════════════════════
{id:"R1.1",cat:"D.指環",q:"Acer 指環有哪些健康追蹤功能？",a:"可追蹤：睡眠分析、心率、血氧、壓力指數、活動追蹤與恢復狀態。支援心率、HRV、血氧與睡眠階段分析。所有數據均供日常健康管理參考，不具醫療診斷功能。"},
{id:"R1.2",cat:"D.指環",q:"Acer 指環要戴在哪個手指？",a:"建議配戴於非慣用手的中指或食指上。確保戒指穩固但不緊繃，以避免妨礙血流或感應異常。"},
{id:"R1.3",cat:"D.指環",q:"Acer 指環電池可以用多久？",a:"依照使用情境2-4天，實際續航因使用模式而異。建議低於10%即進行充電，避免過度放電。充電時間約60分鐘，充電完成後燈號呈現綠光閃爍。"},
{id:"R1.4",cat:"D.指環",q:"Acer 指環怎麼充電？",a:"使用隨附磁吸式充電座，僅需放置即可充電。充電規格：DC 5V 1A。\n長時間不佩戴時，請將電量充至50%以上並關機，勿放在充電裝置上超過一週。"},
{id:"R1.5",cat:"D.指環",q:"Acer 指環防水嗎？",a:"具備防水設計，可應付日常汗水、雨水及洗手情境。不建議長時間浸泡於水中，亦不建議於游泳、泡澡或溫泉時配戴，以免損壞感測器。"},
{id:"R1.6",cat:"D.指環",q:"Acer 指環可以戴著睡覺嗎？",a:"可以，建議於夜間持續配戴以獲得完整睡眠數據。"},
{id:"R1.7",cat:"D.指環",q:"Acer 指環對應哪個App？",a:"請至Google Play或Apple App Store下載「Acer FreeSense Ring」App。\n相容系統：Android 8.0以上 / iOS 12.0以上。支援同步至Apple Health與Google Health Connect。"},
{id:"R1.8",cat:"D.指環",q:"Acer 指環藍芽斷線或無法配對怎麼辦？",a:"1. 確認手機藍芽已開啟，且與戒指處於10公尺內範圍\n2. 檢查App是否為最新版本\n3. 嘗試重新啟動手機與App"},
{id:"R1.9",cat:"D.指環",q:"Acer 指環充電異常怎麼辦？",a:"1. 確認戒指與充電座接點是否有異物，以乾布擦拭後重新放置\n2. 檢查充電器是否正確接上電源與原廠充電線\n如以上方法無效，請聯絡客服中心。"},
{id:"R1.10",cat:"D.指環",q:"Acer 指環無法運作怎麼辦？",a:"1. 先檢查電池是否電量不足，充電後再嘗試\n2. 若配戴較鬆可能影響感測精準度，請調整位置確保感測器貼合皮膚\n3. 如仍無法正常運作，建議於App中執行「重置戒指」（重置前確認資料已同步至雲端）"},
{id:"R1.11",cat:"D.指環",q:"Acer 指環怎麼清潔？",a:"每週建議清潔1-2次，以無棉絨柔布輕拭戒指內圈與感測部位。\n請勿使用：酒精、漂白水、洗碗精、超音波清洗機或吹風機。"},
{id:"R1.12",cat:"D.指環",q:"Acer 指環如何選擇尺寸？",a:"建議先購買Acer FreeSense Ring尺寸測量組(Sizing Kit)，在家試戴找到最合適的戒圍後，再依實際測量結果購買。若配戴未貼合，可能導致資料遺漏或測量數據不正常。"},
{id:"R1.13",cat:"D.指環",q:"Acer 指環保固內容為何？",a:"保固期限：發票日+12個月（需檢附電子統一發票）。\n保固範圍：非人為因素導致的功能性故障（感測器異常、電池無法充電、無法開機等）。\n非保固範圍：人為刮傷、撞擊、損壞或非原廠維修所造成之故障。"},
{id:"R1.14",cat:"D.指環",q:"Acer 指環含鎳嗎？適合過敏膚質嗎？",a:"本產品含有微量鎳元素，鎳含量低於歐盟REACH法規限制標準。由於鎳位於戒指內部，正常使用下皮膚不會直接接觸。若您對鎳特別敏感，建議使用前先諮詢醫師。"},

// 華碩手錶（VivoWatch 6）
// ══════════════════════════════════════════
{id:"AW1.1",cat:"E.華碩",q:"華碩VivoWatch 6 有哪些功能？",a:"提供：脈波指數（壓力評估）、血氧參考值、活動心率、身體組成分析、睡眠追蹤、放鬆指數測量、計步、運動GPS、天氣、通知等功能。所有健康數據僅供參考，不具醫療診斷功能。"},
{id:"AW1.2",cat:"E.華碩",q:"華碩手錶怎麼充電？",a:"將USB充電線的充電針腳對準並置於充電連接埠上，連接到電源開始充電（輸入：5Vdc，0.5A）。充電前請確保充電連接埠乾燥，以防腐蝕。"},
{id:"AW1.3",cat:"E.華碩",q:"華碩手錶對應哪個App？",a:"請下載「ASUS HealthConnect」App（Google Play / App Store）。\n相容系統：Android 8.0以上 / iOS 13.0以上。初次配對需開啟手機藍芽，並確認手錶在手機3公尺內。"},
{id:"AW1.4",cat:"E.華碩",q:"華碩手錶怎麼配對？",a:"1. 按住主頁按鈕約1秒將手錶開機\n2. 開啟ASUS HealthConnect App\n3. 依照手機與手錶上的畫面指示完成配對程序"},
{id:"AW1.5",cat:"E.華碩",q:"華碩手錶防水嗎？",a:"具有5 ATM防水性能，適用於水花時、下雨、淋浴和游泳。請勿在含化學物質或鹽水（海水、游泳池或溫泉）中使用，以免損壞充電連接埠。"},
{id:"AW1.6",cat:"E.華碩",q:"華碩手錶強制重新啟動怎麼做？",a:"按住「主頁/電源」按鈕10秒鐘。"},
{id:"AW1.7",cat:"E.華碩",q:"華碩手錶怎麼更新韌體？",a:"1. 開啟ASUS HealthConnect App\n2. 點按主頁底部的「裝置」\n3. 選擇「韌體版本」並點按「檢查更新」"},
{id:"AW1.8",cat:"E.華碩",q:"華碩手錶如何量血壓/壓力？",a:"VivoWatch 6透過脈波指數（PTT）評估壓力。量測時請將手指輕輕覆蓋在多用途電子感測器與PPG組合感測器上，並保持靜止。"},
{id:"AW1.9",cat:"E.華碩",q:"華碩手錶身體組成分析怎麼做？",a:"建議在早晨空腹、如廁後進行。有植入心臟起搏器、懷孕、月經期間不可進行測量。\n操作：食指放在BIA感測器（螢幕外圍金屬環）上，大拇指放在PPG感測器上，保持靜止。"},
{id:"AW1.10",cat:"E.華碩",q:"華碩手錶一卡通iPASS怎麼用？",a:"本產品支援iPASS一卡通支付功能（僅台灣版）。\n加值方式：可在捷運站自動加值機台直接加值，或至便利商店加值。\n使用時請將手錶靜置於感應區，待交易完成後再移開，以免交易失敗。"},

{id:"GW1.1",cat:"F.Garmin",q:"Garmin手環怎麼配對手機？",a:"1. 安裝並開啟Garmin Connect App\n2. 第一次設定：按下按鍵以開啟手環\n3. 若先前已跳過配對：按鍵→設定→手機→配對手機\n4. 依照App畫面指示完成配對"},
{id:"GW1.2",cat:"F.Garmin",q:"Garmin手環我的手機無法連結？",a:"1. 將手環帶到手機範圍內\n2. 如已配對：關閉手環與手機的藍芽，再重新開啟\n3. 如未配對：在手機上啟用藍芽，開啟Garmin Connect App→Garmin裝置→新增裝置\n4. 在手環上：按鍵→設定→手機→與手機配對"},
{id:"GW1.3",cat:"F.Garmin",q:"Garmin手環怎麼充電？",a:"將USB線較小的一端插入手環的充電埠，將USB線較大的一端插入USB供電埠。充電前請清潔並保持傳輸接點乾燥，以免鏽蝕。"},
{id:"GW1.4",cat:"F.Garmin",q:"Garmin手環怎麼重置？",a:"長按按鍵10秒後放開。手環會短暫顯示三角形，然後顯示錶面。此動作不會刪除任何資料。"},
{id:"GW1.5",cat:"F.Garmin",q:"Garmin手環步數和帳戶不同步？",a:"與Garmin Connect App同步步數，等待手環同步資料（可能需要幾分鐘）。更新App不會同步資料或更新步數。"},
{id:"GW1.7",cat:"F.Garmin",q:"Garmin手環心率數據不穩或未出現？",a:"1. 戴上手環前請先清潔並擦乾手腕\n2. 確認手環鬆緊適中，感測器貼合皮膚\n3. 關閉藍芽後重新開啟\n4. 重啟手環及手機"},
{id:"GW1.8",cat:"F.Garmin",q:"Garmin手環如何關閉來電通知？",a:"方法一（透過Garmin Connect App）：\n1. 開啟Garmin Connect App\n2. 選擇「Garmin裝置」→ 點擊vivosmart 5\n3. 點選「提醒」→「智慧通知」→「一般使用」\n4. 找到「來電」並切換為「關閉」\n\n方法二（手環上）：\n1. 在手環上滑動找到「設定」（齒輪圖示）\n2. 點擊「勿擾模式」（月亮圖示）開啟"},
{id:"GW1.9",cat:"F.Garmin",q:"Garmin手環數據未上傳？",a:"Garmin串接需18歲以上註冊。如果已經註冊為18歲以下，建議重新註冊另外一個信箱，並填寫大於18歲以上（2007年前出生）。"},

{id:"I-1",cat:"I.客服流程",q:"如何判斷初診還是複診？",a:"複診LINE名字會是「姓名+出生年月日+地區」，例如：許震魚 900722 台北。"},
{id:"I-2",cat:"I.客服流程",q:"客服如何回覆關懷訊息？",a:"患者回應後，可先回：「謝謝您的回饋，我們將轉給同仁做紀錄。需要我們協助的地方，可以跟我們說唷，祝您順心。」\n然後通知同仁做紀錄或回覆。"},
{id:"I-3",cat:"I.客服流程",q:"患者症狀回報怎麼處理？",a:"1. 關懷訊息回覆，轉LINE給詢問的同仁（若為諮詢師，則需開照會）\n2. 若判斷患者症狀惡化，則開照會給所屬醫師\n3. 患者主動訴症狀，開照會給健管組"},
{id:"I-4",cat:"I.客服流程",q:"需要直接轉諮詢師的項目有哪些？",a:"以下項目需通知諮詢師並開立照會（不傳訊至諮詢師個人LINE）：\n・解約、續約\n・機器密碼申請（展延）\n・約時間要收機器"},
{id:"I-5",cat:"I.客服流程",q:"退押金流程是什麼？",a:"患者確認儀器或衣服已寄送回來並確定結束合約後：\n1. 請患者提供銀行存摺正面照片\n2. 提醒患者程序大約5-7個工作天\n3. 轉帳完成後會再通知患者"},
{id:"I-6",cat:"I.客服流程",q:"台北診所停車資訊？",a:"・中正區懷寧街路邊停車場：20元/半小時\n・台北車站西區地下停車場：平日60元/小時，例假日70元/小時\n・台北車站東區地下停車場：平日60元/小時，例假日70元/小時\n・機車臨停：10元/小時"},
{id:"I-6b",cat:"I.客服流程",q:"桃園診所停車資訊？",a:"・中壢停四停車場（立體停車場，限高1公尺）：10元/半小時\n・中北停車場：30元/半小時\n・Times中壢中北路2停車場：50元/半小時\n注意：Times多數無現金繳費，需行動支付"},
{id:"I-6c",cat:"I.客服流程",q:"新竹診所停車資訊？",a:"遠見停車場（新竹市北區四維路20號）：40元/小時，步行約3分鐘\n（林森路往四維路方向直走第一個路口右轉進四維路，在丁丁藥局旁）"},
{id:"I-7",cat:"I.客服流程",q:"台中診所停車資訊？",a:"・角落停綠川停車場（民權路40-1號）：平日20元/半小時；例假日35元/半小時\n・Times台中綠川西街（綠川西街59巷）：平日20元/半小時；例假日35元/半小時\n・Times台中綠川東街（民權路30號）：平日20元/半小時；例假日40元/半小時\n・繼光停車場（民生路34巷4號）：平日50元/小時；例假日40元/半小時\n注意：Times多數無現金繳費，需行動支付"},
{id:"I-8",cat:"I.客服流程",q:"高雄診所停車資訊？",a:"安寧重慶停車場（三民區安寧街）：30元/半小時，步行至診所約3分鐘\n路邊停車格：九如路與博愛路兩側"},
{id:"I-9",cat:"I.客服流程",q:"為什麼不能開醫療收據或三聯式發票？",a:"我們的產品屬於個人保健用的租賃商品，不是醫療器材或醫療費用，依法提供「二聯式發票」作為個人租賃憑證。目前無法提供三聯式發票或公司統編報帳使用。"},
{id:"I-10",cat:"I.客服流程",q:"患者對治療點位開立有疑慮怎麼回覆？",a:"醫師在評估改點的概念，不僅是針對症狀及整體神經的調節，調整自律神經的方式是從平衡的角度，讓器官回歸正軌的運作方式。醫師也有自己的考量來做治療部位的調理，就算是同一種症狀的部位開立，也有幾種模式可以選擇。希望有回答到您的問題。"},

// ── 問題軌跡紀錄 ──
const questionLog = [];

function logQuestion(q, answer){
  const now = new Date();
  questionLog.push({
    time: now.toLocaleString('zh-TW'),
    question: q,
    answer: answer.replace(/\n/g,' ').substring(0,200),
  });
  updateLogBadge();
}

function updateLogBadge(){
  const badge = document.getElementById('logBadge');
  if(badge) badge.textContent = questionLog.length;
}

function exportCSV(){
  if(questionLog.length === 0){ alert('還沒有任何問題紀錄。'); return; }
  const BOM = '\uFEFF';
  const header = '時間,問題,回答摘要\n';
  const rows = questionLog.map(r =>
    `"${r.time}","${r.question.replace(/"/g,'""')}","${r.answer.replace(/"/g,'""')}"`
  ).join('\n');
  const blob = new Blob([BOM + header + rows], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toLocaleDateString('zh-TW').replace(/\//g,'-');
  a.download = `小智問題紀錄_${dateStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

let isLoading=false;
function setCat(k,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.style.display='none';

  const groups = SUGG_GROUPS[k];
  if(!groups) return;

  const wrap = document.getElementById('chatWrap');
  const guideEl = document.createElement('div');
  guideEl.className = 'msg-row';

  const catLabels = {'6th':'第六代紅光極智衣','home':'居家治療儀','ring':'Acer 指環','asus':'華碩手錶','garmin':'Garmin 手環','fee':'費用／合約','clinic':'診所／客服'};
  const catLabel = catLabels[k] || k;

  let groupsHTML = '';
  groups.forEach(g => {
    const isUrgent = g.title.includes('突發');
    groupsHTML += `<div style="margin-top:10px;">
      <div style="font-size:11px;font-weight:600;color:${isUrgent ? '#c0392b' : 'var(--t4)'};margin-bottom:5px;">${g.title}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    g.items.forEach(item => {
      const urgentStyle = isUrgent ? 'border-color:#f5b7b1;background:#fdf2f2;color:#922b21;' : '';
      groupsHTML += `<button class="sugg" style="${urgentStyle}" onclick="useSugg(this)">${item}</button>`;
    });
    groupsHTML += `</div></div>`;
  });

  guideEl.innerHTML = `
    <div class="avatar bot-av">AI</div>
    <div style="max-width:85%">
      <div class="guide-bubble">
        <strong>已切換到【${catLabel}】</strong><br>
        <span style="font-size:13px;color:var(--t6)">請問您想了解哪方面的問題呢？</span>
        ${groupsHTML}
        <div style="margin-top:12px;font-size:12px;color:var(--t4);">或直接在下方輸入問題 ✍️</div>
      </div>
    </div>`;
  wrap.appendChild(guideEl);
  scroll();
}

function useSugg(btn){
  document.getElementById('inputBox').value=btn.textContent;
  sendMessage();
}
function findRelated(q,a){
  const c=(q+' '+a).toLowerCase();
  return FAQ.filter(f=>c.includes(f.q.substring(0,8).toLowerCase())).slice(0,3);
}
function buildFAQText(){
  return FAQ.map(f=>`【${f.id}】${f.cat}\nQ：${f.q}\nA：${f.a}`).join('\n\n');
}
function buildSystemPrompt(){
  return `你是智平衡健康事業的 AI 客服助理「小智」，服務診所為「拉菲爾人本診所」（台北、桃園、新竹、台中、高雄）。

## 核心規則（必須嚴格遵守）：
1. 【只能使用下方 FAQ 資料回答】絕對不可自行發揮、添加、推測或改寫任何內容
2. 【完整照抄原文】找到對應 FAQ 後，將 A 欄的內容完整、逐字回覆給使用者，不可省略任何步驟
3. 【找不到答案時】只說：「這個問題需要進一步確認，建議您直接聯繫診所同仁協助處理。」不可自行編造答案
4. 【禁止】不可加入 FAQ 以外的任何說明、建議或步驟
5. 使用繁體中文，語氣親切專業

## FAQ 知識庫（這是唯一的資料來源）：
${buildFAQText()}`;
}
async function sendMessage(){
  const box=document.getElementById('inputBox');
  const text=box.value.trim();
  if(!text||isLoading)return;
  document.getElementById('welcome').style.display='none';
  addUser(text);box.value='';box.style.height='44px';
  showTyping();isLoading=true;document.getElementById('sendBtn').disabled=true;
  try{
    const payload={
      message:text,
      systemPrompt:buildSystemPrompt(),
      faqData:FAQ.map(f=>({id:f.id,cat:f.cat,q:f.q,a:f.a}))
    };
    const res=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const reply=await res.text();
    hideTyping();addBot(reply,findRelated(text,reply));logQuestion(text,reply);
  }catch(e){hideTyping();addBot('抱歉，發生錯誤：'+e.message+'。請稍後再試，或直接聯繫診所同仁。');}
  isLoading=false;document.getElementById('sendBtn').disabled=false;
}
function addUser(text){
  const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const row=document.createElement('div');row.className='msg-row user';
  row.innerHTML=`<span class="ts">${now}</span><div class="bubble user-b">${esc(text)}</div><div class="avatar user-av">我</div>`;
  document.getElementById('chatWrap').appendChild(row);scroll();
}
function addBot(text,related=[]){
  const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const fmt=esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  const srcs=related.length?`<div class="srcs">${related.map(f=>`<span class="stag" title="${esc(f.q)}">${f.id}</span>`).join('')}</div>`:'';
  const row=document.createElement('div');row.className='msg-row';
  row.innerHTML=`<div class="avatar bot-av">AI</div><div class="bubble bot-b">${fmt}${srcs}</div><span class="ts">${now}</span>`;
  document.getElementById('chatWrap').appendChild(row);scroll();
}
function showTyping(){
  const el=document.createElement('div');el.className='msg-row';el.id='typing';
  el.innerHTML='<div class="avatar bot-av">AI</div><div class="typing-b"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
  document.getElementById('chatWrap').appendChild(el);scroll();
}
function hideTyping(){document.getElementById('typing')?.remove();}
function scroll(){const a=document.getElementById('chatArea');a.scrollTop=a.scrollHeight;}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='44px';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
