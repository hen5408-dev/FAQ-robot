<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小智｜智平衡 AI 客服</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#1a5c38;--g2:#217a4a;--g3:#27ae60;--g4:#2ecc71;
  --gp:#f0faf4;--gl:#a8dfc0;
  --bg:#f5faf7;--white:#fff;
  --t9:#1a1a18;--t7:#3d3d3a;--t6:#5f5e5a;--t4:#9c9a92;--t2:#e0dfdc;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --font:'Noto Sans TC',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t9);display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 60%,var(--g3) 100%);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(26,92,56,.3);flex-shrink:0}
.hdr-logo{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid rgba(255,255,255,.35)}
.hdr-logo svg{width:22px;height:22px;fill:#fff}
.hdr-info{flex:1}
.hdr-name{font-size:15px;font-weight:700;color:#fff}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:4px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:#a8ff8a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.35);white-space:nowrap}
#chatArea{flex:1;overflow-y:auto;padding:20px 0;scroll-behavior:smooth}
#chatWrap{max-width:800px;width:100%;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:4px}
#welcome{text-align:center;padding:24px 16px 20px}
.welcome-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--g2),var(--g4));border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(33,122,74,.3)}
.welcome-icon svg{width:36px;height:36px;fill:#fff}
.welcome-title{font-size:19px;font-weight:700;color:var(--g1);margin-bottom:6px}
.welcome-sub{font-size:13px;line-height:1.9;color:var(--t6);margin-bottom:22px}
.cat-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.cat-btn{padding:8px 18px;border-radius:22px;border:1.5px solid var(--gl);background:var(--white);color:var(--g1);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:.18s}
.cat-btn:hover,.cat-btn.active{background:var(--g3);border-color:var(--g3);color:#fff;box-shadow:0 2px 8px rgba(39,174,96,.35)}
.sugg-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg{padding:8px 14px;border-radius:8px;border:1px solid var(--t2);background:var(--white);color:var(--t7);font-family:var(--font);font-size:12px;cursor:pointer;transition:.15s;text-align:left}
.sugg:hover{border-color:var(--g3);color:var(--g1);background:var(--gp)}
.msg-row{display:flex;gap:9px;align-items:flex-end;margin-bottom:10px;animation:msgIn .22s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.bot-av{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff}
.user-av{background:var(--t2);color:var(--t6)}
.bubble{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.85;word-break:break-word}
.bot-b{background:var(--white);border:1px solid var(--t2);border-bottom-left-radius:4px;box-shadow:var(--shadow);color:var(--t9)}
.user-b{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(33,122,74,.25)}
.ts{font-size:10px;color:var(--t4);font-family:var(--mono);padding:0 3px;flex-shrink:0}
.typing-b{background:var(--white);border:1px solid var(--t2);border-radius:18px;border-bottom-left-radius:4px;padding:14px 18px;box-shadow:var(--shadow);display:flex;gap:5px;align-items:center}
.td{width:7px;height:7px;border-radius:50%;background:var(--gl);animation:bounce .8s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.srcs{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.stag{font-size:11px;background:var(--gp);color:var(--g1);padding:2px 8px;border-radius:4px;font-family:var(--mono);border:1px solid var(--gl)}
.input-bar{background:var(--white);border-top:1px solid var(--t2);padding:12px 16px;flex-shrink:0}
.input-inner{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#inputBox{flex:1;padding:11px 14px;border:1.5px solid var(--t2);border-radius:12px;font-family:var(--font);font-size:14px;color:var(--t9);background:var(--bg);resize:none;outline:none;line-height:1.5;min-height:44px;max-height:120px;transition:border-color .15s}
#inputBox:focus{border-color:var(--g3);background:var(--white)}
#inputBox::placeholder{color:var(--t4)}
#sendBtn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g3));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
#sendBtn:hover{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 2px 8px rgba(33,122,74,.4)}
#sendBtn:disabled{background:var(--t2);cursor:not-allowed;box-shadow:none}
#sendBtn svg{width:18px;height:18px;fill:#fff}
.hint{font-size:11px;color:var(--t4);text-align:center;margin-top:6px;max-width:800px;margin-left:auto;margin-right:auto}
#chatArea::-webkit-scrollbar{width:5px}
#chatArea::-webkit-scrollbar-track{background:transparent}
#chatArea::-webkit-scrollbar-thumb{background:var(--gl);border-radius:3px}
@media(max-width:500px){.hdr-badge{display:none}.bubble{max-width:86%}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
  <div class="hdr-info">
    <div class="hdr-name">小智｜智平衡 AI 客服</div>
    <div class="hdr-sub"><span class="dot"></span>線上服務中</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
    <button onclick="exportCSV()" title="匯出問題紀錄 CSV" style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.25);cursor:pointer;white-space:nowrap;font-family:var(--font);">
      📥 紀錄 <span id="logBadge" style="background:rgba(255,255,255,.3);border-radius:10px;padding:1px 6px;font-size:10px;min-width:16px;text-align:center;display:inline-block;">0</span>
    </button>
    <button onclick="clearChat()" style="background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.25);cursor:pointer;white-space:nowrap;font-family:var(--font);">🗑 清空</button>
    <div class="hdr-badge">智平衡健康集團－創新研發處</div>
  </div>
</header>
<div id="chatArea"><div id="chatWrap">
  <div id="welcome">
    <div class="welcome-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="welcome-title">您好！我是小智 👋</div>
    <div class="welcome-sub">智平衡健康事業 AI 助理<br>請選擇產品類別，或直接輸入您的問題</div>
    <div class="cat-wrap">
      <button class="cat-btn" onclick="setCat('controller',this)">🔴 紅光控制器</button>
      <button class="cat-btn" onclick="setCat('garment',this)">👕 紅光衣</button>
      <button class="cat-btn" onclick="setCat('wearable',this)">⌚ 穿戴裝置</button>
      <button class="cat-btn" onclick="setCat('app',this)">📱 APP藍芽</button>
      <button class="cat-btn" onclick="setCat('contract',this)">💳 合約費用</button>
      <button class="cat-btn" onclick="setCat('other',this)">📋 其他項目</button>
    </div>
    <div class="sugg-wrap" id="suggWrap"></div>
  </div>
</div></div>
<div class="input-bar">
  <div class="input-inner">
    <textarea id="inputBox" placeholder="輸入您的問題…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <div class="hint">由 AI 自動回覆，重要事項請聯繫診所同仁確認</div>
</div>
<script>
const FAQ=[

// ══════════════════════════════════════════
// A. 費用與合約
// ══════════════════════════════════════════
{id:"A1.1",cat:"A.費用合約",q:"轉帳帳號是什麼？",a:"帳號：0010-3501-7867\n戶名：智平衡健康事業股份有限公司\n\n患者對方案費用有疑問，請健康顧問回覆。"},
{id:"A1.2",cat:"A.費用合約",q:"已經去匯款繳費了，請提供匯款紀錄",a:"請詢問患者：匯款日期、金額、戶名、帳號末五碼、銀行別。\n確認已入帳後，請記得回覆患者。\n\n建議通知業務部醫療&客服對接群組 @客服部-李昀儒（協助查帳），並提供：區域、姓名、生日、轉帳金額、轉帳項目、轉帳日期、末五碼。\n若是健康顧問提供線上刷卡，請 @佩倫經理查帳。"},
{id:"A1.3",cat:"A.費用合約",q:"為什麼不用押金？",a:"合約到期或提前解約，必須依指示完整歸還。自然損耗或不可抗力不在此限。"},
{id:"A1.4",cat:"A.費用合約",q:"請問是開發票還是收據？",a:"屬保健用租賃商品，非醫療項目也非醫療器材。\n提供「二聯式發票」，僅作為個人租賃憑證。\n無法提供醫療收據或三聯式發票。"},
{id:"A1.5",cat:"A.費用合約",q:"為什麼只能租不能買？",a:"儀器設定、設備皆為客製化，期間會針對您的狀況及數據上傳，由醫師評估調整，以即時掌握狀態並做改善。屬整體服務，無法買斷。"},
{id:"A2.1",cat:"A.費用合約",q:"我合約什麼時候到期？保健衣租約起訖日是何時？",a:"依系統合約租期告知患者，先了解患者詢問的原因或需求（挽留）。\n若患者對租期有疑問，建議告知請健康顧問回覆。\n\n患者對租期有疑問時才需通知健康顧問。"},
{id:"A2.2",cat:"A.費用合約",q:"我合約到期了，再來怎麼處理？",a:"建議詢問患者目前使用狀況及是否要續約：\n・使用狀況不好或無感：邀約回診，參考醫生建議再決定。\n・使用狀況良好：建議續約，請健康顧問說明費用及期間。\n\n要續約或不續約均通知健康顧問。"},
{id:"A2.3",cat:"A.費用合約",q:"合約到期不續約，要怎麼退還保健衣？",a:"到期日後有三天彈性時間，可將紅光設備及極智衣繳回診所，合約才會停止計算。\n可郵寄回（請在包裹上寫姓名），宅配限一次免費。\n\n郵寄地址：\n・台北：台北市中正區館前路49號11樓 拉菲爾人本診所\n・台中：台中市中區民權路60號3樓 拉菲爾人本診所\n・高雄：高雄市三民區九如二路366號10樓 拉菲爾健康管理診所"},
{id:"A2.4",cat:"A.費用合約",q:"合約結束了想退押金",a:"需先退還設備用品，再提供押金退款帳號（存摺封面照片）。\n押金約15個工作天會匯款至指定帳戶，匯款完成後通知確認。\n\n收到帳號資料後建議通知健康顧問辦理。"},
{id:"A2.5",cat:"A.費用合約",q:"衣服／儀器已經寄回去，收到了沒有？",a:"請與患者確認寄回日期及收件地址，查詢後回覆。\n流程：郵寄（台北/台中/高雄）或親自交回，健管收到後轉給健康顧問。\n\n建議通知健康顧問確認，收到後於居家聯繫紀錄備註已收到保健衣。"},
{id:"A2.6",cat:"A.費用合約",q:"費用是否含營養保健品？需要持續吃保健品嗎？",a:"費用不包含營養品；如有需要，需自費購買。\n可詢問醫師是否需要繼續吃保健品。"},
{id:"A2.7",cat:"A.費用合約",q:"提早解約，費用要怎麼算？",a:"建議先詢問患者解約原因，並轉給健康顧問。\n依「實際使用期間比例」計算可退金額，會先扣除客製極智衣耗材費 NT$50,000。"},
{id:"A3.1",cat:"A.費用合約",q:"想轉其他方案",a:"建議詢問想轉換療程的原因，並留言給健康顧問，請健康顧問協助討論規劃後通知後續。\n\n請通知健康顧問回覆。"},

// ══════════════════════════════════════════
// B. 使用說明
// ══════════════════════════════════════════
{id:"B1.1",cat:"B.使用說明",q:"第六代紅光極智衣是什麼做的？",a:"極智衣內外層皆為彈性材質的機能布料、快乾、透氣。穿脫方便、活動不受限。\n主要是內層的紅光貼片用來調節神經。"},
{id:"B1.2",cat:"B.使用說明",q:"紅光貼片的功能是什麼？",a:"1. 誘發粒線體活化，促進新陳代謝和細胞修復。\n2. 神經傳導路徑激活，促進交感與副交感神經平衡。"},
{id:"B1.3",cat:"B.使用說明",q:"貼片有效期的問題嗎？",a:"貼片測試後是可以反覆使用的。如果有儀器上的使用問題，請再跟我們說。"},
{id:"B1.4",cat:"B.使用說明",q:"極智衣怎麼穿才對？",a:"・裡面不能穿（當內衣穿）\n・衣服順順紮進內褲裡\n・側邊肩線對齊\n・拉鍊在中線，通過肚臍\n・將揹帶斜揹，並調整長度到腰際高度\n・穿著時，可做家事、工作、緩和運動\n・轉身移動範圍不要太大\n\n一次60分鐘，一天可做兩次，需間隔六小時以上。"},
{id:"B1.6",cat:"B.使用說明",q:"什麼時候穿比較好？",a:"（胃食道逆流）：餐前穿可幫助腸胃蠕動與消化，效果更好。\n（睡眠障礙及其他症狀）：晚上睡前穿。\n每日建議選擇固定時間穿即可（神經痛可選在容易疼痛時間穿）。"},
{id:"B1.7",cat:"B.使用說明",q:"醫生說餐前1小時穿，來不及可以餐中穿嗎？",a:"（胃食道逆流）：找午/晚其中一餐穿。如果來不及，用餐同時可以繼續穿，沒有問題。\n穿的時候放輕鬆不要一直想穿多久，越焦慮反而不好。"},
{id:"B1.8",cat:"B.使用說明",q:"第六代紅光極智衣怎麼洗滌保養？",a:"・先拔開控制器（控制器不可水洗）\n・建議3天至2週洗一次\n・將衣服集線盒置在衣服中間並包覆起來，再裝入專屬洗衣袋\n・置於洗衣機中清洗\n・勿搓揉、擰乾；勿加柔軟精；勿烘乾"},
{id:"B1.9",cat:"B.使用說明",q:"洗後，會不會影響效果？",a:"不會，第六代紅光極智衣的部件經過水洗測試，可以水洗。控制器部分不能水洗。"},
{id:"B2.1",cat:"B.使用說明",q:"紅光控制器怎麼操作？",a:"1. 衣服穿著完畢\n2. 將白色插頭連接在控制器上\n3. 長按電源鍵直至儀器響起\n4. 開機後，連結藍芽\n5. 更新部位確認\n6. 按下功能鍵\n7. 即可開始治療"},
{id:"B2.2",cat:"B.使用說明",q:"治療中提示音及燈號顯示",a:"【燈號說明】\n・綠燈恆亮：開機 或 充電已完成\n・綠燈閃爍：充電中\n・白燈恆亮：使用中\n・白燈閃爍：暫停中\n・黃燈恆亮：電量偏低，本次使用完請充電\n・紅燈恆亮：合約到期 / 在六小時的冷卻期間\n・紅燈閃爍：電量太低，請充電後再使用\n・藍燈閃爍：藍芽資料傳輸中"},
{id:"B2.3",cat:"B.使用說明",q:"使用中有沒有活動上的限制？",a:"建議動作不要太大，以免線路移位導致接觸不良。若不小心扯掉接頭，會觸發接頭鬆脫警示。"},
{id:"B2.4",cat:"B.使用說明",q:"都在同一時間點治療，會有適應性的問題嗎？",a:"一般建議睡前穿紅光衣，能幫助放鬆身心、穩定入睡。\n若發現睡前穿反而更清醒，可能跟天氣變化、壓力波動有關。\n建議在「沒壓力、能安心休息」的時間治療，效果通常會更好。"},
{id:"B2.5",cat:"B.使用說明",q:"當天可以做幾次？",a:"一天依照需求，最多可以做兩次，建議由醫師評估。每次間隔不得少於六小時。"},
{id:"B2.6",cat:"B.使用說明",q:"晚上治療後，隔天中午以前無法使用？",a:"每次治療間隔不得少於6小時，若兩次間隔不足6小時，將無法再次使用。"},
{id:"B2.7",cat:"B.使用說明",q:"怎麼知道紅光控制器有正常運作或已停止？",a:"運作中，logo燈會發光；本次調整結束控制器將自動關機，燈號熄滅。\n可連接藍芽確認儀器狀態。"},
{id:"B2.8",cat:"B.使用說明",q:"貼片有固定亮的數量嗎？",a:"紅光貼片共有48片，會依照醫師調整點位點亮，不會48片全亮。最多會有16片。\n建議連接藍芽確認儀器狀態。"},
{id:"B2.9",cat:"B.使用說明",q:"紅光治療中可以中斷嗎？",a:"每次調節為60分鐘，建議一次完成。\n若有不可抗因素，可按下功能鍵暫停，暫停沒有時間限制，但建議一小時內完成。\n暫停每五分鐘會提醒一次，二十分鐘後關機。\n\n・暫停前不足30分鐘：可開機重新治療60分鐘\n・超過30分鐘：須等6小時冷卻後才能治療"},
{id:"B2.10",cat:"B.使用說明",q:"點位取得失敗 / 已取得合約錯誤 / 更新資料錯誤 / 會員交付時點位失敗",a:"1. 先查詢 HIS 與 APP 的電話號碼是否相同\n2. 確認 HIS 的電話號碼是否有兩個人以上共用 → 須將非會員的電話號碼改掉\n\n如果以上都排除後仍有問題，請患者將儀器送回檢視。"},
{id:"B3.1",cat:"B.使用說明",q:"充電注意事項",a:"請先把衣服端拔開，使用專屬充電器進行充電（不可在充電時治療）。\n\n充電步驟：\n1. 插電後，語音提示充電中，LOGO燈號轉為綠燈閃爍\n2. 4~6小時充飽電\n3. 充電完成後，語音提示，LOGO燈綠燈轉為恆亮\n4. 再拔插頭"},
{id:"B3.2",cat:"B.使用說明",q:"充電燈號說明",a:"・充電中：綠燈閃爍\n・滿電：亮綠燈"},
{id:"B3.3",cat:"B.使用說明",q:"充電失敗、四小時未飽電、充電時燈號熄滅",a:"確認患者是否使用智平衡提供的充電組。\n因儀器有精密零件，如用一般充電線或頭，可能出現不相容狀況。\n請使用提供的充電組，並確認充電線需完整插入Type C孔中。\n可重新插上插座與充電器，確認目前指示燈號。\n\n注意：電池在使用到極低電量或完全沒電時，充電充到滿需6~8小時（極低電量的充電保護機制）。"},
{id:"B3.4",cat:"B.使用說明",q:"帶到國外電壓不同，會不會無法充電？",a:"儀器內建變壓器，100~240伏特均可使用。但需自備轉接頭（依各國規格自備）。"},
{id:"B3.5",cat:"B.使用說明",q:"出國坐飛機，儀器要怎麼帶？",a:"・控制器：需放隨身行李\n・極智衣：可放托運行李中\n\n紅光控制器中的鋰電池已通過安全規範，其認證貼於儀器表面。\n注意：因中國大陸認證機制特殊，故無法帶到中國大陸。"},
{id:"B4.1",cat:"B.使用說明",q:"哪種方案效果好？",a:"・短期見效：居家\n・長期調理：第六代\n・重點保養：第四、五代紅光\n・溫和恢復：調節衣、睡眠衣"},
{id:"B4.2",cat:"B.使用說明",q:"穿了以後用藥怎麼調整？",a:"請隨時在APP上留紀錄，並拍處方籤，我們會盡快聯繫您，並請醫師幫您評估調整。"},
{id:"B4.4",cat:"B.使用說明",q:"紅光雙效活力衣有禁忌症嗎？",a:"沒有，若有疑問可再請教健康顧問或醫師。"},
{id:"B4.5",cat:"B.使用說明",q:"皮膚有傷口，能直接照射嗎？發炎情況下，有沒有可能惡化？",a:"先了解發炎部位是否與治療重疊。\n建議留下紀錄在APP對話中，或立即與健康顧問聯繫，協助評估與調整。"},
{id:"B4.6",cat:"B.使用說明",q:"紅光的波長是多少，屬於紅外線嗎？",a:"660nm區間，屬於有特殊物理特性的可視紅光（非紅外線）。"},
{id:"B4.7",cat:"B.使用說明",q:"儀器有沒有衛服部認證？",a:"紅光儀器屬「保健用產品」，主要作為日常身心放鬆、自律神經調節的非侵入式輔助方案，能安全地搭配日常保養或其他療程。\n由於療程搭配有醫師診斷與專人追蹤，會根據您的身體反應進行貼片調整，確保安全與適配性。"},
{id:"B4.8",cat:"B.使用說明",q:"儀器穿戴有專利號嗎？",a:"TW202029899A\nTW202029992A\nTWM659528U"},

// ══════════════════════════════════════════
// C. 衣服與儀器問題
// ══════════════════════════════════════════
{id:"C1.1",cat:"C.衣服儀器",q:"什麼時候可以拿到第六代紅光極智衣？",a:"我們會安排專人與您聯繫，安排您方便的時間，進行到府教學，亦可到診所進行教學。\n現場練習穿戴及操作儀器，訓練當天特別申請一次治療讓您回家使用。"},
{id:"C1.2",cat:"C.衣服儀器",q:"回診當天，需要帶什麼回來？",a:"當天需帶健保卡回診及部分負擔50元。"},
{id:"C1.3",cat:"C.衣服儀器",q:"看診能把改好的衣服帶回家嗎？",a:"當收到APP通知，即可知道醫師判斷這次是否需要調整點位，您即可利用APP進行遠端部位調整。"},
{id:"C1.4",cat:"C.衣服儀器",q:"衣服可以寄過來給我嗎？我要改寄件地址？",a:"如不方便取貨，可採郵寄方式寄送，需確認基本資料表上的寄件地址/電話。"},
{id:"C1.5",cat:"C.衣服儀器",q:"衣服是新的還是舊的？收到後要先清洗或消毒嗎？",a:"第六代紅光極智衣皆是針對個人客製化完成，屬全新，您可放心使用。\n是否先清洗再穿，依個人衛生習慣自行斟酌。"},
{id:"C1.6",cat:"C.衣服儀器",q:"我覺得極智衣Size不對？",a:"先了解患者覺得哪個部分較緊/寬。\n請患者確認衣領內部的size。\n衣服在製作過程到送出均有名牌貼在衣服上，出貨前也會再確認。\n如真的不合，下次看診時帶回，由專人幫您修改。"},
{id:"C2.1",cat:"C.衣服儀器",q:"多久回來看診？",a:"健康顧問每兩周會與您聯繫，醫師每兩周會回顧您的狀況，判斷是否需要調整點位；若沒有特殊狀況，3個月回來看診一次即可。"},
{id:"C2.2",cat:"C.衣服儀器",q:"第六代紅光極智衣患者回診預約作業",a:"建議詢問患者下次回診的日期與時間，並同步填入排程及HIS系統。\n・以已排程為主\n・若排程已滿，請洽健康顧問開放位置"},

// ══════════════════════════════════════════
// D. 突發事件
// ══════════════════════════════════════════
{id:"D1.1",cat:"D.突發事件",q:"穿了以後會頭暈、心跳加快？其他症狀？",a:"請從APP上回報給我們，我們會幫您做初步紀錄及建議。\n頭暈跟心跳加快是原本循環問題，治療過程有改善循環，循環變好症狀就會慢慢改善。\n若持續感覺不適，也請讓我們知道，我們會請醫師評估。"},
{id:"D1.2",cat:"D.突發事件",q:"穿了之後皮膚很癢，沒辦法穿怎麼辦？",a:"有些患者皮膚較敏感，建議第六代紅光極智衣洗過再穿。\n治療過程有改善循環，循環變好症狀就會慢慢改善。\n\n建議上居家聯繫紀錄備註：患者反映穿了會癢。"},
{id:"D1.3",cat:"D.突發事件",q:"什麼時候要上傳數據？",a:"一般建議兩周要更新一次使用紀錄，以便醫師根據您的使用狀況進行點位調整。\n健康數據只要穿戴並固定充電，應會自動連藍芽。\n病情紀錄建議三天內觀察症狀，固定回報。"},
{id:"D1.4",cat:"D.突發事件",q:"我怎麼知道醫師幫我改點了？",a:"APP會推播訊息給您，告訴您本次醫師評估是否需要調整位置，與點位是否調整完畢。"},
{id:"D2.1",cat:"D.突發事件",q:"貼片沒有亮滿12個貼片",a:"・確定接頭需壓緊\n・APP後台確認是否都是固定接頭接觸不良\n・建議衣服重製，置換問題接頭"},
{id:"D2.1b",cat:"D.突發事件",q:"插銷歪了 / 插頭彎曲變形 / 接頭斷掉 / 插銷有形變 / 衣服插頭損壞 / 紅光輸出異常疑似接頭損壞",a:"接頭有明顯形變（彎曲或斷裂），已影響紅光輸出，無法靠壓緊或重置解決。\n\n處理方式：\n請同仁派件製作一件新衣給會員，並安排快遞到府收回損壞衣服送回生產部評估。"},
{id:"D2.2",cat:"D.突發事件",q:"儀器LOGO燈為黃燈閃爍",a:"電量偏低，請於本次使用後，立刻進行充電。"},
{id:"D2.3",cat:"D.突發事件",q:"儀器LOGO燈為紅燈閃爍",a:"電量過低，有可能在使用途中斷電，請先充電後再使用。"},
{id:"D2.4",cat:"D.突發事件",q:"儀器有無法遙控解決的問題",a:"請帶回診所做檢修。\n因儀器等相關不可抗因素導致治療中斷，我們會申請天數延後。"},
{id:"D2.5",cat:"D.突發事件",q:"未連藍芽的情況下，使用儀器治療，時間未滿60分鐘就結束",a:"請患者連藍芽，讓我們由後台查看數據。"},
{id:"D2.6",cat:"D.突發事件",q:"出現合約到期提示音，導致儀器無法正常使用",a:"先利用基本資料中的【重設藍芽裝置設定】解決合約已到期問題。\n\n操作步驟：\n【會員中心】→ 基本資料 → 下滑到【重置藍芽】→ 重新打開控制儀\n\n可能原因：儀器的【RTC】跑掉。"},
{id:"D2.7",cat:"D.突發事件",q:"出現【今日已使用】異常訊號",a:"確認距上次使用結束已隔6小時以上。\n後台查詢 → 讀取訂單 → 開始日期：114/01/01（app工程師設定的問題）。"},
{id:"D2.8",cat:"D.突發事件",q:"治療儀器開機後直接關機",a:"確認患者是否長按超過3分鐘以上，導致開機後又關機。"},
{id:"D2.9",cat:"D.突發事件",q:"治療儀器開機並按開始治療後，自動關機",a:"先去APP後台，看操作紀錄。\n如出現同一接頭接觸不良，有可能是衣服接頭問題，需重製衣。"},
{id:"D2.10",cat:"D.突發事件",q:"充電不能，一直出現紅色LOGO燈",a:"確認無法充電後，請開立交換儀器訂單執行交換。"},
{id:"D2.11",cat:"D.突發事件",q:"使用中出現答答答雜音、自動開關機、或充電後儀器變熱",a:"請開立交換儀器訂單執行交換。"},
{id:"D2.12",cat:"D.突發事件",q:"使用紀錄未完善",a:"與儀器版本有關，需為韌體0401版本。\n治療後一分鐘，儀器會自動關機。\n若未成功上傳資料，明天開機連線藍芽，會將前一天的治療結束紀錄補上傳。"},
{id:"D2.13",cat:"D.突發事件",q:"儀器背帶鬆脫",a:"背帶扣環可能有鬆掉，需要一字起子固定，建議回診由現場協助。\n目前出廠前已有用膠水加強固定。"},

// ══════════════════════════════════════════
// E. 護您穩／平衡衣問題
// ══════════════════════════════════════════
{id:"E1.1",cat:"E.護您穩平衡衣",q:"護您穩是什麼材質，作用是什麼？",a:"護您穩是舒適的T恤版型。\n貼片是石墨烯材質，作用是紅外線，能做機能性調整。\n面對不同情境可自選適合的平衡衣。"},
{id:"E1.2",cat:"E.護您穩平衡衣",q:"護您穩多久會有一件？最多幾件？",a:"平均一年會有10-12件。"},
{id:"E1.3",cat:"E.護您穩平衡衣",q:"用我的最愛製作，如果每個位置都喜歡，可以都製作嗎？",a:"會由醫師評估，AI協助選點。"},
{id:"E1.4",cat:"E.護您穩平衡衣",q:"護您穩什麼時候穿，誰幫我判斷？",a:"醫師會給您建議，會希望這組「我的最愛」做治療幾次，再來確定製作護您穩。"},
{id:"E1.5",cat:"E.護您穩平衡衣",q:"護您穩貼片的效期有永久的嗎？",a:"黑點的能量是會持續的，但會依照使用習慣和清潔習慣不同，黑點會逐漸有磨耗狀態，大概可以使用3~6個月，或更久。"},
{id:"E1.6",cat:"E.護您穩平衡衣",q:"護您穩貼片會渲染，怎麼會這樣？",a:"請您拍照讓我們看一下衣服裡面的貼片狀況，我們幫您申請一件新的。"},

// ══════════════════════════════════════════
// F. 穿戴裝置問題（手錶、指環）
// ══════════════════════════════════════════
{id:"F1.1",cat:"F.穿戴裝置",q:"超過保固期，遇到無法正常使用的情況",a:"合約期間，非人為蓄意破壞，請寄回公司，我們將承擔修復的費用。"},
{id:"F1.2",cat:"F.穿戴裝置",q:"數據無法正常更新",a:"請先確認是哪種裝置：\nAcer 指環 → 請查看 F1.9（指環數據上傳不完整）\n華碩手錶 → 請查看 F1.24（手錶資料未同步至後台）\nGarmin 手環 → 請查看 F1.17（Garmin 數據未上傳）\n\n通用初步排解（適用所有裝置）：\n1. 確認裝置電量充足（建議30%以上）\n2. 確認手機藍牙已開啟\n3. 關閉手機藍牙 → 等待約10秒 → 重新開啟\n4. 將裝置靠近手機（建議30公分內）\n5. 重新開啟對應App\n6. 重啟穿戴裝置及手機"},
{id:"F1.3",cat:"F.穿戴裝置",q:"錶面較大，手腕活動時，影響動作",a:"可至少隔一指的寬度往上戴。依照每個人的手臂舒適度，可以稍微鬆一點。"},
{id:"F1.4",cat:"F.穿戴裝置",q:"戒指指環比較大，容易鬆脫",a:"建議順序：\n1. 先試著戴中指或是慣用手食指\n2. 請研發部設置止滑墊片\n3. 更換小尺寸指環"},
{id:"F1.5",cat:"F.穿戴裝置",q:"指環無法連線",a:"・確認指環是否有電\n・重新連接裝置"},
{id:"F1.6",cat:"F.穿戴裝置",q:"手錶突然黑屏",a:"1. 確認充電是否為充電頭插接（不要插電腦），充電20-30分鐘\n2. 長按開關10秒或點兩下螢幕\n3. 如仍無法正常使用，送回公司檢修\n\n建議請示主管是否有備用錶替換。"},
{id:"F1.7",cat:"F.穿戴裝置",q:"ACER指環心律變異性正常數值是多少？",a:"心率變異數字沒有特定標準，根據年齡與狀態而有不同，通常越高越好。"},
{id:"F1.8",cat:"F.穿戴裝置",q:"充電完後就顯示BOOTLOADER畫面",a:"Bootloader為工程師用來除錯、修復作業系統的模式。\n\n排解方式：\n再次連接USB充電線，長按右上方按鈕約12秒，等待螢幕出現「BOOTLOADER」藍色字樣後放開，再短按一次右上方按鈕即可開機。\n若誤觸進入bootloader模式，按一下手錶右上方的按鈕即可離開。"},
{id:"F1.9",cat:"F.穿戴裝置",q:"指環及手錶的數據上傳不完整",a:"先了解配戴狀況（合身與否）、電力是否歸零、連線狀態是否正常。\n\n備註：\n1. 數據撈取訂為六小時後。\n2. 數據皆會存在裝置中，等藍芽連線後會自動上傳。"},
{id:"F1.10",cat:"F.穿戴裝置",q:"指環或手錶的睡眠時間不符合現實",a:"先了解同一時間的其他健康數據是否正常輸出，如果無，請回到F1.9排解。\n如未睡著前心律較低且穩定、沒有太大移動動作，會被判定為睡眠開始。"},
{id:"F1.11",cat:"F.穿戴裝置",q:"指環或手錶的睡眠數據中斷",a:"先確認同一時間的其他健康數據是否正常輸出，如果無，請回到F1.9排解。\n1. 如果在睡眠期間心律高於100，會被判定為非睡眠狀態；血氧也有可能影響。\n2. 裝置在無意識狀態（睡眠），有否脫掉而不自知。"},
{id:"F1.12",cat:"F.穿戴裝置",q:"手錶設定鬧鐘有聲音提醒嗎？一卡通、天氣、跌倒偵測有嗎？",a:"1. 沒有鬧鐘聲音提醒\n2. 沒有一卡通、天氣、跌倒偵測（因為我們用的是企業APP，沒有綁定GPS和個人資料）"},
{id:"F1.13",cat:"F.穿戴裝置",q:"手錶無法測量到心電圖",a:"排解步驟：\n1. 手錶是否配戴正常，錶帶鬆緊度適中，錶盤能緊貼手腕處\n2. 確認感測器有無髒污\n3. 會員皮膚是否乾燥，可用保濕乳液潤濕後再測試\n4. 確認App與手錶韌體版本是最新\n\n排解後仍有問題，回報給創新研發處評估是否送檢或是交換儀器。"},

{id:"F1.17",cat:"F.穿戴裝置",q:"Garmin手環數據未上傳",a:"Garmin串接需18歲以上註冊。如果已經註冊為18歲以下，建議重新註冊另外一個信箱，並填寫大於18歲以上（2007年前出生）。"},
{id:"F1.18",cat:"F.穿戴裝置",q:"Garmin手環要如何關閉來電通知？",a:"方法一（推薦）：透過Garmin Connect App\n1. 開啟Garmin Connect App\n2. 點選右下角「更多」（iPhone）或左上角「三」（Android）\n3. 選擇「Garmin裝置」\n4. 點擊您的vivosmart 5\n5. 點選「提醒」→「智慧通知」→「一般使用」\n6. 在清單中找到「來電」，切換為「關閉」\n\n方法二（暫時性）：在手環上啟用「勿擾模式」\n1. 輕點兩下喚醒手環\n2. 滑動找到並點擊「設定」（齒輪圖示）\n3. 點擊「勿擾模式」（月亮圖示），將其開啟"},

{id:"F1.20",cat:"F.穿戴裝置",q:"使用者重新登入帳號或重新綁定指環後，歷史資料不見",a:"確認App 1.0.7、確認是否同帳號登入、重新同步資料。\n\n若資料仍未恢復，請記錄：\n1. 登入帳號\n2. 重新登入/綁定時間\n3. 消失的資料日期範圍\n4. App版本\n提供工程端查詢。"},
{id:"F1.21",cat:"F.穿戴裝置",q:"正常配戴指環，但某段心率、活動、壓力、HRV或其他資料缺失",a:"1. 確認指環韌體已更新至FW 1.2.0或以上版本\n2. 確認指環當時是否有低電量\n3. 確認該時段是否有正常配戴\n4. 開啟App並等待同步完成\n5. 若同步未完成，可重新開啟App後再次連線\n\n若仍有資料缺漏，請提供：\n・缺漏資料類型\n・缺漏日期與時間區間\n・指環電量狀態\n・App與FW版本\n・是否曾斷線、重登或重新綁定"},
{id:"F1.22",cat:"F.穿戴裝置",q:"只有睡眠資料沒有產生或遺失，但其他資料正常保存",a:"1. 確認睡眠期間是否全程配戴指環\n2. 確認睡前指環電量是否充足\n3. 起床後開啟App並等待資料同步完成\n4. 確認其他生理資料是否仍正常保存\n\n此問題目前列為FW優化項目，預計於FW 1.2.1改善。若遇到案例，請持續收集：睡眠日期、配戴時間、電量、App版本與FW版本。"},
{id:"F1.23",cat:"F.穿戴裝置",q:"指環突然無法連線，需要放回充電座後才可恢復連線",a:"1. 將指環放回充電座\n2. 確認充電座是否有正常供電\n3. 等待指環恢復後，再重新連線App\n4. 若多次發生，判定為異常\n\n現階段如有發生，建議直接安排換貨處理。異常品可退回進一步分析。"},
{id:"F1.24",cat:"F.穿戴裝置",q:"華碩手錶資料未同步至後台",a:"1. 確認App版本（使用HealthConnect Business App）\n2. 確認連線與序號：手錶與App已連線，後台序號與裝置一致\n3. 確認App內資料：App中可見最新量測紀錄\n4. 確認後台數據：釐清無資料時間段\n\n若後台仍無資料：回報廠商並提供「產品序號」與「資料異常時間段 YYYY/MM/DD ~ YYYY/MM/DD」，確認雲端資料及API狀況。"},

// ── 問題軌跡紀錄 ──
const questionLog = [];

function logQuestion(q, answer){
  const now = new Date();
  questionLog.push({
    time: now.toLocaleString('zh-TW'),
    question: q,
    answer: answer.replace(/\n/g,' ').substring(0,200),
  });
  updateLogBadge();
}

function updateLogBadge(){
  const badge = document.getElementById('logBadge');
  if(badge) badge.textContent = questionLog.length;
}

function exportCSV(){
  if(questionLog.length === 0){ alert('還沒有任何問題紀錄。'); return; }
  const BOM = '\uFEFF';
  const header = '時間,問題,回答摘要\n';
  const rows = questionLog.map(r =>
    `"${r.time}","${r.question.replace(/"/g,'""')}","${r.answer.replace(/"/g,'""')}"`
  ).join('\n');
  const blob = new Blob([BOM + header + rows], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toLocaleDateString('zh-TW').replace(/\//g,'-');
  a.download = `小智問題紀錄_${dateStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

    <div class="welcome-sub">智平衡健康事業 AI 助理<br>請選擇產品類別，或直接輸入您的問題</div>
  </div>`;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  chatHistory.length = 0;
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('hintBar').textContent = '由 AI 自動回覆，重要事項請聯繫診所同仁確認';
  document.getElementById('hintBar').style.color = '';
}
function setCat(k,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.style.display='none';

  const groups = SUGG_GROUPS[k];
  if(!groups) return;

  const wrap = document.getElementById('chatWrap');
  const guideEl = document.createElement('div');
  guideEl.className = 'msg-row';

  const catLabels = {'controller':'紅光控制器','garment':'紅光衣','wearable':'穿戴裝置（手錶/指環）','app':'APP與藍芽問題','contract':'合約與費用','other':'其他項目'};
  const catLabel = catLabels[k] || k;

  let groupsHTML = '';
  groups.forEach(g => {
    const isUrgent = g.title.includes('突發');
    groupsHTML += `<div style="margin-top:10px;">
      <div style="font-size:11px;font-weight:600;color:${isUrgent ? '#c0392b' : 'var(--t4)'};margin-bottom:5px;">${g.title}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    g.items.forEach(item => {
      const urgentStyle = isUrgent ? 'border-color:#f5b7b1;background:#fdf2f2;color:#922b21;' : '';
      groupsHTML += `<button class="sugg" style="${urgentStyle}" onclick="useSugg(this)">${item}</button>`;
    });
    groupsHTML += `</div></div>`;
  });

  guideEl.innerHTML = `
    <div class="avatar bot-av">AI</div>
    <div style="max-width:85%">
      <div class="guide-bubble">
        <strong>已切換到【${catLabel}】</strong><br>
        <span style="font-size:13px;color:var(--t6)">請問您想了解哪方面的問題呢？</span>
        ${groupsHTML}
        <div style="margin-top:12px;font-size:12px;color:var(--t4);">或直接在下方輸入問題 ✍️</div>
      </div>
    </div>`;
  wrap.appendChild(guideEl);
  scroll();
}

function useSugg(btn){
  document.getElementById('inputBox').value=btn.textContent;
  sendMessage();
}
function findRelated(q,a){
  const c=(q+' '+a).toLowerCase();
  return FAQ.filter(f=>c.includes(f.q.substring(0,8).toLowerCase())).slice(0,3);
}
function buildFAQText(){
  return FAQ.map(f=>`【${f.id}】${f.cat}\nQ：${f.q}\nA：${f.a}`).join('\n\n');
}
function buildSystemPrompt(){
  return `你是智平衡健康事業創新研發處的內部 AI 助理「小智」，專門協助診所同仁查詢產品操作與客服流程。

## 使用對象
本工具供診所內部同仁使用，回答內容以「建議同仁如何處理」為主要方向。

## 回答規則（必須嚴格遵守）：

1. 【精準比對 FAQ】
   - 先判斷問題的核心關鍵字，找到 FAQ 中最相關的那一筆。
   - 只回答最符合的那一筆 FAQ，不要把多筆 FAQ 混在一起回答。
   - 如果問題描述很長（如患者姓名、症狀描述），只取其中的「問題核心」去比對 FAQ。

2. 【裝置辨識規則】
   - 問題中出現「指環」→ 直接視為 Acer 指環，查 F1.x FAQ，不需要再問。
   - 問題中出現「手錶」→ 直接視為華碩手錶，查 F1.x FAQ，不需要再問。
   - 問題中出現「手環」→ 直接視為 Garmin 手環，查 F1.17~F1.18 FAQ，不需要再問。
   - 問題中出現「控制器」「紅光」「極智衣」→ 直接視為第六代紅光，查 B/D/G FAQ，不需要再問。
   - 問題涉及「App操作、更新、驗證碼、治療倒數、穿衣紀錄」→ 直接查 G 系列 FAQ，不需要反問裝置。
   - 問題中出現「點位取得失敗」「已取得合約錯誤」「點位獲得失敗」→ 直接查 B2.10 FAQ。
   - 問題中出現「插頭彎」「插銷歪」「形變」「接頭斷」「損壞」且涉及衣服 → 直接查 D2.1b FAQ，直接建議派件製作新衣。
   - 只有問題明確涉及「藍芽連線/配對/同步」且完全沒有提到任何裝置名稱時，才反問：「請問是哪種產品的藍芽？\n1. 第六代紅光控制器\n2. Acer 指環\n3. 華碩手錶\n4. Garmin 手環」

3. 【找到對應 FAQ → 直接回答】
   - 將 FAQ 答案完整呈現，用數字條列步驟，語氣親切簡潔。
   - 絕對不可增加、補充或推測 FAQ 以外的任何步驟或說明。
   - 回答結尾加上：「若仍無法解決，請 @許震宇 做進一步協助。」

4. 【找不到對應 FAQ → 給初步排解 + 轉介】
   回覆格式如下：
   「目前 FAQ 尚未收錄此問題，建議先做初步排解：
   步驟一：確認手機是否有網路連線
   步驟二：開啟 WiFi 並確認連線正常
   步驟三：確認藍芽已開啟且裝置在有效範圍內（3-4公尺內）
   逐一排除後若仍無法解決，請 @許震宇 做進一步的協助。」

5. 【語氣】使用繁體中文，親切、簡潔、專業。

## FAQ 知識庫：
${buildFAQText()}`;
}

// ── 對話歷史 ──
const chatHistory = [];

async function sendMessage(){
  const box=document.getElementById('inputBox');
  const text=box.value.trim();
  if(!text||isLoading)return;
  document.getElementById('welcome').style.display='none';
  addUser(text);box.value='';box.style.height='44px';
  showTyping();isLoading=true;document.getElementById('sendBtn').disabled=true;

  // 加入使用者訊息到歷史
  chatHistory.push({role:'user', content: text});

  try{
    const payload={
      message: text,
      history: chatHistory.slice(-10), // 最近 10 輪對話
      systemPrompt: buildSystemPrompt(),
      faqData: FAQ.map(f=>({id:f.id,cat:f.cat,q:f.q,a:f.a}))
    };
    const res=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const reply=await res.text();
    // 加入 AI 回覆到歷史
    chatHistory.push({role:'assistant', content: reply});
    hideTyping();addBot(reply);logQuestion(text,reply);
  }catch(e){
    chatHistory.pop(); // 失敗時移除剛才加入的使用者訊息
    hideTyping();addBot('抱歉，發生錯誤：'+e.message+'。請稍後再試，或直接聯繫診所同仁。');
  }
  isLoading=false;document.getElementById('sendBtn').disabled=false;
}
function addUser(text){
  const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const row=document.createElement('div');row.className='msg-row user';
  row.innerHTML=`<span class="ts">${now}</span><div class="bubble user-b">${esc(text)}</div><div class="avatar user-av">我</div>`;
  document.getElementById('chatWrap').appendChild(row);scroll();
}
function addBot(text,related=[]){
  const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const fmt=esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  const srcs=related.length?`<div class="srcs">${related.map(f=>`<span class="stag" title="${esc(f.q)}">${f.id}</span>`).join('')}</div>`:'';
  const row=document.createElement('div');row.className='msg-row';
  row.innerHTML=`<div class="avatar bot-av">AI</div><div class="bubble bot-b">${fmt}${srcs}</div><span class="ts">${now}</span>`;
  document.getElementById('chatWrap').appendChild(row);scroll();
}
function showTyping(){
  const el=document.createElement('div');el.className='msg-row';el.id='typing';
  el.innerHTML='<div class="avatar bot-av">AI</div><div class="typing-b"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
  document.getElementById('chatWrap').appendChild(el);scroll();
}
function hideTyping(){document.getElementById('typing')?.remove();}
function scroll(){const a=document.getElementById('chatArea');a.scrollTop=a.scrollHeight;}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='44px';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── 語音輸入 ──
function toggleVoice(){
  const btn = document.getElementById('voiceBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('您的瀏覽器不支援語音輸入，建議使用 Chrome 或 Edge。'); return; }
  if(btn && btn.classList.contains('recording')){
    if(window._recognition) window._recognition.stop();
    return;
  }
  const r = new SR();
  window._recognition = r;
  r.lang = 'zh-TW';
  r.continuous = false;
  r.interimResults = true;
  r.onstart = () => { if(btn){ btn.classList.add('recording'); } document.getElementById('inputBox').placeholder = '🎙 聆聽中，請說話…'; };
  r.onresult = (e) => { const t = Array.from(e.results).map(x=>x[0].transcript).join(''); document.getElementById('inputBox').value = t; autoResize(document.getElementById('inputBox')); };
  r.onend = () => { if(btn){ btn.classList.remove('recording'); } document.getElementById('inputBox').placeholder = '輸入您的問題…'; };
  r.onerror = () => { if(btn){ btn.classList.remove('recording'); } document.getElementById('inputBox').placeholder = '輸入您的問題…'; };
  r.start();
}
